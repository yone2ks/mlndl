[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlndl"
version = "0.1.0"
description = "Multi-Layer Network Description Language — portable topology schema"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mlndl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
