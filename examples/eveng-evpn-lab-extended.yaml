control_plane:
  # EVPN の書き方の 2 つ目 (ADR-0010): underlay は直結の /31 どうしの eBGP、overlay は loopback0 どうしの eBGP multihop。
  # BGP のエントリは VRF ごとのインスタンス。VRF-lite の外部接続はテナントの VRF ごとのインスタンスに書く。
  # spine の route server としての振る舞い・maximum-paths・allowas-in (leaf3 / leaf4 が同じ AS) は MLNDL の範囲外 (ADR-0010 D12)
  bgp:
    - id: bgp-default
      nodes:
        - {node: spine1, local_as: 65000}
        - {node: spine2, local_as: 65000}
        - {node: leaf1,  local_as: 65001}
        - {node: leaf2,  local_as: 65002}
        - {node: leaf3,  local_as: 65034}     # vPC ペアは同じ AS
        - {node: leaf4,  local_as: 65034}
        - {node: leaf5,  local_as: 65005}
        - {node: leaf6,  local_as: 65006}
    - id: bgp-tenant-a
      vrf: vrf-tenant-a
      nodes:
        - {node: leaf6,   local_as: 65006}
        - {node: wan-rtr, local_as: 65100}
    - id: bgp-tenant-b
      vrf: vrf-tenant-b
      nodes:
        - {node: leaf6,   local_as: 65006}
        - {node: wan-rtr, local_as: 65100}

  routing_neighbors:
    # ── アンダーレイ eBGP（P2P アドレスで張る）───────────────────────────
    - {id: bgp-peer-spine1-leaf1, type: bgp, instance: bgp-default, from: {node: spine1, update_source: spine1-e1-1-l3}, to: {node: leaf1, update_source: leaf1-e1-1-l3}, address_families: [ipv4_unicast]}
