# P1: 1 つの拠点が広域イーサと IP-VPN の両方を持つ (bridge を書く箱と書かない箱の混在)
#
# 構成:
#   tokyo-rtr - [KDDI 広域イーサ] - osaka-rtr          ... bridge を書く (L2 透過)
#   tokyo-rtr / osaka-rtr / nagoya-rtr - [NTT IP-VPN]  ... bridge を書かない (事業者が L3 で終端)
#
# ゼロから考えた書き分け:
#   - 広域イーサは「事業者網が L2 を透過する」ので、両端のルーターが直接 BGP を張れる。
#     D1 でいう「bridge を書く構成」。箱の 2 つの L1 IF を 1 つの bridge の ports に入れる。
#   - IP-VPN は「事業者網が各拠点の PE で L3 終端する」ので、拠点ごとに PE との 1 対 1 の
#     BGP を張る。拠点どうしは直接セッションを張らない。bridge は書かない。
#     ADR-0017 の「事業者網を箱で表す」ところまでは同じで、箱の中が L2 透過するかどうかで
#     bridge の有無が決まる。
#   - 「箱に L1 IF がぶら下がる」までは同じ。bridge は L2 透過 (= 中身を見ずに素通り) を
#     足で宣言する構成子。箱の内部を書かない原則 (ADR-0017) との整合も自然。
#
# 試した論点 (Pass C Input サマリ):
#   1. bridge の最小の形 — ports に箱の L1 IF 2 本だけ。拠点のルーター IF は書かない
#   2. bridge に届くことの判定 — 両端 L3 IF の attaches_to の L1 IF の対向が bridge の
#      ports にある。1 ホップで届く
#   7. ADR-0017 D5-2 の置き換え — 広域イーサ上の BGP を両端 node で書く。D5-2 の
#      「片側トポロジー外にする回避策」は不要になる
#
# 期待する validator の結果 (この設計で実装したら):
#   - errors: 0
#   - 広域イーサの BGP の通り道: {bridge: bridge-we220}
#   - IP-VPN の 3 本の BGP: トポロジー外相手 ({address, local_as}) なので通り道は導かない
#     (ADR-0010 のまま)
#   - IP-VPN 側に bridge がないことについて warning は出ない (bridge を書かない = L2 透過
#     ではない、を素直に読む / D1)
#
# 書きにくかった点:
#   - 「bridge を書くかどうか」が事業者網の形 (L2 or L3) で分かれる。L1 の見た目は同じ
#     (ルーター - 箱 - ルーター) なので、「bridge があれば L2 透過」の規約を読み手が
#     知っている必要がある。IP-VPN の箱に bridge がないことを「正しく書けた」と確信する
#     ための手がかりが構文内にない。bridge を書かない正解はドラフト本文 (D1 の
#     「bridge を書くのは箱をはさむときだけ」) を読んで知る形。
#   - Pass B との差: なし。同じ結論に到達した。箱の 2 ノードが同じ L1 の見た目でも、
#     「L2 透過かどうか」が bridge の有無で決まる書き分けはゼロから書いても自然だった。

ndl_version: "1.0"

meta:
  name: P1-mixed-wideether-and-ipvpn
  description: "A site has both wide-area Ethernet (L2-transparent, bridge) and IP-VPN (L3-terminated, no bridge)"
  network_types: [l1-physical, l2-network, l3-unicast]

layer1:
  nodes:
    - {id: tokyo-rtr,  name: Tokyo-RTR,  role: border, implementation: physical, labels: {site: tokyo}}
    - {id: osaka-rtr,  name: Osaka-RTR,  role: border, implementation: physical, labels: {site: osaka}}
    - {id: nagoya-rtr, name: Nagoya-RTR, role: border, implementation: physical, labels: {site: nagoya}}
    - id: net-kddi-wideether
      name: KDDI Wide-Area Ethernet
      role: provider-network
      description: "L2-transparent EPL, port-based WE-220"
    - id: net-ntt-ipvpn
      name: NTT IP-VPN
      role: provider-network
      description: "L3-terminated IP-VPN, VPN-01"

  interfaces:
    - {id: tokyo-rtr-ge0,  node: tokyo-rtr,  name: Ge0/0}       # to KDDI wide-ether
    - {id: tokyo-rtr-ge1,  node: tokyo-rtr,  name: Ge0/1}       # to NTT IP-VPN
    - {id: osaka-rtr-ge0,  node: osaka-rtr,  name: Ge0/0}       # to KDDI wide-ether
    - {id: osaka-rtr-ge1,  node: osaka-rtr,  name: Ge0/1}       # to NTT IP-VPN
    - {id: nagoya-rtr-ge0, node: nagoya-rtr, name: Ge0/0}       # to NTT IP-VPN
    - {id: net-kddi-wideether-tokyo, node: net-kddi-wideether, name: tokyo}
    - {id: net-kddi-wideether-osaka, node: net-kddi-wideether, name: osaka}
    - {id: net-ntt-ipvpn-tokyo,  node: net-ntt-ipvpn, name: tokyo}
    - {id: net-ntt-ipvpn-osaka,  node: net-ntt-ipvpn, name: osaka}
    - {id: net-ntt-ipvpn-nagoya, node: net-ntt-ipvpn, name: nagoya}

  links:
    - {id: link-tokyo-wideether, endpoints: [tokyo-rtr-ge0, net-kddi-wideether-tokyo], link_speed: 1G,
       description: "Access line WE-220-T, 500 Mbps contracted"}
    - {id: link-osaka-wideether, endpoints: [osaka-rtr-ge0, net-kddi-wideether-osaka], link_speed: 1G,
       description: "Access line WE-220-O, 500 Mbps contracted"}
    - {id: link-tokyo-ipvpn,  endpoints: [tokyo-rtr-ge1,  net-ntt-ipvpn-tokyo],  link_speed: 1G,
       description: "Access line VPN-01-T, 200 Mbps"}
    - {id: link-osaka-ipvpn,  endpoints: [osaka-rtr-ge1,  net-ntt-ipvpn-osaka],  link_speed: 1G,
       description: "Access line VPN-01-O, 200 Mbps"}
    - {id: link-nagoya-ipvpn, endpoints: [nagoya-rtr-ge0, net-ntt-ipvpn-nagoya], link_speed: 1G,
       description: "Access line VPN-01-N, 100 Mbps"}

layer2:
  bridges:
    # 広域イーサは L2 透過なので bridge を書く。
    # ports は「転送する側」= 箱の L1 IF 2 本だけ。拠点のルーター IF は書かない。
    - id: bridge-we220
      name: WE-220
      description: "L2-transparent segment of KDDI Wide-Area Ethernet WE-220"
      ports:
        - {interface: net-kddi-wideether-tokyo}
        - {interface: net-kddi-wideether-osaka}

  # IP-VPN は L3 で終端するので bridge を書かない。
  # (「書かなければ透過しない」の規約 / D1 のとおり)

layer3:
  vrfs:
    - {id: vrf-default}

  interfaces:
    # 広域イーサ側 — 両端は同じ /30 の両端
    - {id: tokyo-rtr-ge0-l3, node: tokyo-rtr, name: Ge0/0, ip: 10.100.0.1/30,
       attaches_to: {interface: tokyo-rtr-ge0}}
    - {id: osaka-rtr-ge0-l3, node: osaka-rtr, name: Ge0/0, ip: 10.100.0.2/30,
       attaches_to: {interface: osaka-rtr-ge0}}

    # IP-VPN 側 — 各拠点は PE との /30 の端点
    - {id: tokyo-rtr-ge1-l3,  node: tokyo-rtr,  name: Ge0/1, ip: 100.64.0.2/30,
       attaches_to: {interface: tokyo-rtr-ge1}}
    - {id: osaka-rtr-ge1-l3,  node: osaka-rtr,  name: Ge0/1, ip: 100.64.0.6/30,
       attaches_to: {interface: osaka-rtr-ge1}}
    - {id: nagoya-rtr-ge0-l3, node: nagoya-rtr, name: Ge0/0, ip: 100.64.0.10/30,
       attaches_to: {interface: nagoya-rtr-ge0}}

control_plane:
  bgp:
    - id: bgp-default
      nodes:
        - {node: tokyo-rtr,  local_as: 65001}
        - {node: osaka-rtr,  local_as: 65002}
        - {node: nagoya-rtr, local_as: 65003}

  routing_neighbors:
    # 広域イーサの上の BGP: 両端 node (= D5-2 の「片側トポロジー外にする回避策」は不要)
    - {id: bgp-peer-tokyo-osaka-wideether, type: bgp,
       from: {node: tokyo-rtr, update_source: tokyo-rtr-ge0-l3},
       to:   {node: osaka-rtr, update_source: osaka-rtr-ge0-l3},
       address_families: [ipv4_unicast]}

    # IP-VPN の上の BGP: 各拠点から PE (トポロジー外)
    - {id: bgp-peer-tokyo-ipvpn, type: bgp,
       from: {node: tokyo-rtr, update_source: tokyo-rtr-ge1-l3},
       to: {address: 100.64.0.1, local_as: 65100},
       address_families: [ipv4_unicast]}
    - {id: bgp-peer-osaka-ipvpn, type: bgp,
       from: {node: osaka-rtr, update_source: osaka-rtr-ge1-l3},
       to: {address: 100.64.0.5, local_as: 65100},
       address_families: [ipv4_unicast]}
    - {id: bgp-peer-nagoya-ipvpn, type: bgp,
       from: {node: nagoya-rtr, update_source: nagoya-rtr-ge0-l3},
       to: {address: 100.64.0.9, local_as: 65100},
       address_families: [ipv4_unicast]}
