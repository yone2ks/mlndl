# Q2 案 V: 3 拠点の広域イーサ (E-LAN) 上の OSPF (broadcast) を layer2.vlans で書く
#
# 案 V の意図:
#   E-LAN を 1 つの layer2.vlans エントリにまとめ、3 拠点の L1 IF と箱の L1 IF を
#   access_ports にする。「OSPF の broadcast セグメントは同じ VLAN の L3 IF が
#   全員隣接」という解釈に拡張する (今の routing_neighbors は 2 端点だけで
#   1 セグメントを表せない)。
#   既存の構文で言うと、現状は routing_neighbors をフルメッシュで N(N-1)/2 本
#   書くしかない (P1 と同じ)。案 V は「同じ VLAN のメンバー全員」をまとめて
#   表せるようにする拡張案。
#
# validator の予想:
#   - 現状の実装: OSPF には transport_mismatch 検査が走らない (P1 で検証済み)。
#     したがって本ファイルの routing_neighbors をフルメッシュ 3 本書く形は
#     errors 0 で OK。VLAN 側の access_ports 整合性は参照整合性だけなので OK。
#   - 「同じ VLAN に全員」の 1 エントリで表す構文 (type: ospf-segment など)
#     は未定義で、ここではまだ書けない。routing_neighbors はフルメッシュで書いた。
#
# 嘘を書いた箇所:
#   - Q1_V と同じく vlan_id: 999 は書き手の推測。E-LAN の中で事業者が使うタグは
#     見えないため、ダミー。
#
# 迷った箇所:
#   - access_ports に箱の 3 本の IF を入れた。E-LAN は 1 セグメントなので
#     1 VLAN に 6 ポート (3 拠点 + 箱の 3 側) になる。構造としては正しいが、
#     ndl-viz などで「VLAN の端点」を描くと箱側 3 本も端点に数えられて
#     重複して見えそう。
#   - routing_neighbors の 3 本に area 情報が 3 回繰り返される (ADR-0010 D8)。
#     セグメント単位の構文 (案 M) ならこの冗長は消える。

ndl_version: "1.0"

meta:
  name: Q2-V-elan-ospf-via-vlan
  description: 3 拠点 E-LAN 上の OSPF を layer2.vlans で表現する試し書き
  network_types: [l1-physical, l2-network, l3-unicast]

layer1:
  nodes:
    - {id: tokyo-rtr,  role: border, implementation: physical, labels: {site: tokyo}}
    - {id: osaka-rtr,  role: border, implementation: physical, labels: {site: osaka}}
    - {id: nagoya-rtr, role: border, implementation: physical, labels: {site: nagoya}}
    - id: net-kddi-elan
      name: KDDI 広域イーサ (WE-LAN-300)
      role: provider-network
      description: マルチポイント型 E-LAN。契約 WE-LAN-300

  interfaces:
    - {id: tokyo-rtr-ge0,  node: tokyo-rtr,  name: Ge0/0}
    - {id: osaka-rtr-ge0,  node: osaka-rtr,  name: Ge0/0}
    - {id: nagoya-rtr-ge0, node: nagoya-rtr, name: Ge0/0}
    - {id: net-kddi-elan-tokyo,  node: net-kddi-elan, name: tokyo}
    - {id: net-kddi-elan-osaka,  node: net-kddi-elan, name: osaka}
    - {id: net-kddi-elan-nagoya, node: net-kddi-elan, name: nagoya}

  links:
    - {id: link-tokyo-elan,  endpoints: [tokyo-rtr-ge0,  net-kddi-elan-tokyo],  link_speed: 1G}
    - {id: link-osaka-elan,  endpoints: [osaka-rtr-ge0,  net-kddi-elan-osaka],  link_speed: 1G}
    - {id: link-nagoya-elan, endpoints: [nagoya-rtr-ge0, net-kddi-elan-nagoya], link_speed: 500M}

layer2:
  vlans:
    - id: vlan-elan-we300
      vlan_id: 999            # 書き手の推測。E-LAN の内部タグは見えない
      name: elan-segment
      access_ports:
        - {interface: tokyo-rtr-ge0}
        - {interface: osaka-rtr-ge0}
        - {interface: nagoya-rtr-ge0}
        - {interface: net-kddi-elan-tokyo}
        - {interface: net-kddi-elan-osaka}
        - {interface: net-kddi-elan-nagoya}

layer3:
  interfaces:
    - {id: tokyo-rtr-ge0-l3,  node: tokyo-rtr,  name: Ge0/0, ip: 10.100.0.1/29, attaches_to: {interface: tokyo-rtr-ge0}}
    - {id: osaka-rtr-ge0-l3,  node: osaka-rtr,  name: Ge0/0, ip: 10.100.0.2/29, attaches_to: {interface: osaka-rtr-ge0}}
    - {id: nagoya-rtr-ge0-l3, node: nagoya-rtr, name: Ge0/0, ip: 10.100.0.3/29, attaches_to: {interface: nagoya-rtr-ge0}}
    - {id: tokyo-rtr-lo,  node: tokyo-rtr,  name: lo0, ip: 10.255.0.1/32}
    - {id: osaka-rtr-lo,  node: osaka-rtr,  name: lo0, ip: 10.255.0.2/32}
    - {id: nagoya-rtr-lo, node: nagoya-rtr, name: lo0, ip: 10.255.0.3/32}

control_plane:
  ospf:
    - id: ospf-default
      nodes:
        - {node: tokyo-rtr}
        - {node: osaka-rtr}
        - {node: nagoya-rtr}

  routing_neighbors:
    # 現状の構文ではセグメント単位では書けないので、フルメッシュで 3 本書く (P1 と同じ)。
    # 案 V の拡張後は「同じ VLAN の L3 IF 全員が隣接」で 1 エントリに畳める想定。
    - {id: ospf-adj-tokyo-osaka,  type: ospf, area: "0.0.0.0",
       from: {node: tokyo-rtr,  interface: tokyo-rtr-ge0-l3},
       to:   {node: osaka-rtr,  interface: osaka-rtr-ge0-l3}}
    - {id: ospf-adj-tokyo-nagoya, type: ospf, area: "0.0.0.0",
       from: {node: tokyo-rtr,  interface: tokyo-rtr-ge0-l3},
       to:   {node: nagoya-rtr, interface: nagoya-rtr-ge0-l3}}
    - {id: ospf-adj-osaka-nagoya, type: ospf, area: "0.0.0.0",
       from: {node: osaka-rtr,  interface: osaka-rtr-ge0-l3},
       to:   {node: nagoya-rtr, interface: nagoya-rtr-ge0-l3}}
