# Q1 案 F: 広域イーサ上の 2 拠点 eBGP を provider_transport フィールドで書く (未実装)
#
# 案 F の意図:
#   箱ノード (または 2 本のアクセス回線) に provider_transport: l2 を宣言する。
#   「この事業者網は中身を L2 透過する」ことを 1 つの属性で言い切り、
#   BGP の通り道導出を「箱の片側 → 箱 → 箱の反対側」とつなげる拡張を前提にする。
#
# validator の予想:
#   - 現状: provider_transport は未定義フィールド。pydantic の extra='forbid' で
#     ERROR。加えて両端 node BGP は transport_mismatch で ERROR。
#   - 案 F 採用時: errors 0 を期待。
#   - 加えて、ユーザーが L3 で終端する網 (IP-VPN) を provider_transport: l2 と
#     書き間違えると validator は何も言えない (フィールドの値はコアがチェック
#     できない。role と同じく自由文字列になるか、enum で縛るか選ばないといけない)。
#
# 嘘を書いた箇所:
#   - なし。
#
# 迷った箇所:
#   - provider_transport は箱ノードに置くのか、箱に向かう L1Link 2 本に置くのか。
#     箱に置くとその箱に接続するすべての拠点が同一セグメント扱いになり、
#     3 拠点以上の広域イーサ (E-LAN) との区別がつかなくなる。
#     L1Link に置くとペアリング (どのアクセス回線とどのアクセス回線が同じ
#     EVC か) をもう 1 層書く必要がある。ここでは「箱 1 つ = 1 セグメント」の
#     単純な定義にして箱に置いた。E-Line と E-LAN の違いは書けない。
#   - 値の候補は l2 / l3 の 2 つで足りるか。IP-VPN は l3、広域イーサは l2、
#     インターネットは? (L3 だが PE が BGP の相手になる = D5-1)。
#     ADR-0005 D4 補則「方式名は構文に入れない」との整合も要検討。

ndl_version: "1.0"

meta:
  name: Q1-F-wideether-ebgp-via-provider-transport
  description: 広域イーサ越しの 2 拠点 eBGP を provider_transport で表現する試し書き (未実装)
  network_types: [l1-physical, l3-unicast]

layer1:
  nodes:
    - {id: tokyo-rtr, role: border, implementation: physical, labels: {site: tokyo}}
    - {id: osaka-rtr, role: border, implementation: physical, labels: {site: osaka}}
    - id: net-ntt-wideether
      name: NTT Com 広域イーサ (WE-220)
      role: provider-network
      provider_transport: l2    # ← 未実装フィールド。この 1 行が案 F の要
      description: 2 拠点を結ぶ広域イーサ。契約 WE-220

  interfaces:
    - {id: tokyo-rtr-ge0, node: tokyo-rtr, name: Ge0/0}
    - {id: osaka-rtr-ge0, node: osaka-rtr, name: Ge0/0}
    - {id: net-ntt-wideether-tokyo, node: net-ntt-wideether, name: tokyo}
    - {id: net-ntt-wideether-osaka, node: net-ntt-wideether, name: osaka}

  links:
    - {id: link-tokyo-wideether, endpoints: [tokyo-rtr-ge0, net-ntt-wideether-tokyo], link_speed: 1G}
    - {id: link-osaka-wideether, endpoints: [osaka-rtr-ge0, net-ntt-wideether-osaka], link_speed: 1G}

layer3:
  interfaces:
    - {id: tokyo-rtr-ge0-l3, node: tokyo-rtr, name: Ge0/0, ip: 10.100.0.1/30, attaches_to: {interface: tokyo-rtr-ge0}}
    - {id: osaka-rtr-ge0-l3, node: osaka-rtr, name: Ge0/0, ip: 10.100.0.2/30, attaches_to: {interface: osaka-rtr-ge0}}

control_plane:
  bgp:
    - id: bgp-default
      nodes:
        - {node: tokyo-rtr, local_as: 65001}
        - {node: osaka-rtr, local_as: 65002}

  routing_neighbors:
    - {id: bgp-peer-tokyo-osaka, type: bgp,
       from: {node: tokyo-rtr, update_source: tokyo-rtr-ge0-l3},
       to:   {node: osaka-rtr, update_source: osaka-rtr-ge0-l3},
       address_families: [ipv4_unicast]}
