# 場面 P4 (案 a): 名前の直しの後の小さな完全な例 — 初版の案
#
# 案 a の選択 (評価メモ「残る論点」1):
#   - `layer2.vxlan`  → `layer2.vxlans`   (複数形。dsl-designer・spec-architect の初版)
#   - IS-IS の値     → `level_1` / `level_2` / `level_all`   (RFC 9130 の `level-all` を下線に置き換え。初版)
#
# ねらい:
#   - 利用者が最初に見る見本の下地として、最終の名前がそろうか (書き心地) を確かめる。
#   - P4b (`vnis` / `level_1_2`) と並べて、書きやすさと読みやすさを比べる (報告は Handback)。
#
# この YAML の構成: 2 leaf + 1 server の EVPN-VXLAN。backbone に IS-IS Level 2。

ndl_version: "1.0"

meta:
  name: p4a-vxlans-levels-split

layer1:
  nodes:
    - { id: leaf1, name: Leaf-1, implementation: vm, role: leaf, device_type: cumulus_linux }
    - { id: leaf2, name: Leaf-2, implementation: vm, role: leaf, device_type: cumulus_linux }
    - { id: server1, name: Server-1, implementation: physical, role: server }

  interfaces:
    - { id: leaf1-swp1, node: leaf1, name: swp1 }     # server1-eth0 へ
    - { id: leaf1-swp2, node: leaf1, name: swp2 }     # leaf2-swp2 へ (IS-IS の通り道)
    - { id: leaf2-swp1, node: leaf2, name: swp1 }     # server1-eth1 へ
    - { id: leaf2-swp2, node: leaf2, name: swp2 }
    - { id: server1-eth0, node: server1, name: eth0 }
    - { id: server1-eth1, node: server1, name: eth1 }

  links:
    - { id: link-leaf1-server1, endpoints: [leaf1-swp1, server1-eth0], link_speed: 10G }
    - { id: link-leaf2-server1, endpoints: [leaf2-swp1, server1-eth1], link_speed: 10G }
    - { id: link-leaf1-leaf2,   endpoints: [leaf1-swp2, leaf2-swp2], link_speed: 10G }

  # ↓ 改名後: 複数形 `lags` (すべてのコレクションにそろう)
  lags:
    - { id: lag-leaf1-server1, node: leaf1, name: bond1, members: [leaf1-swp1], lacp: {mode: active} }
    - { id: lag-leaf2-server1, node: leaf2, name: bond1, members: [leaf2-swp1], lacp: {mode: active} }

  ethernet_segments:
    - id: es-server1
      members:
        - { lag: lag-leaf1-server1 }
        - { lag: lag-leaf2-server1 }

layer2:
  vlans:
    - { id: vlan-100, vlan_id: 100, trunk_ports: [{ ethernet_segment: es-server1 }] }

  vteps:
    - { id: vtep-leaf1-leaf2, sources: [leaf1-lo, leaf2-lo], address: 10.0.100.12/32 }

  # ↓ 改名後 (案 a): 複数形 `vxlans`
  vxlans:
    - id: vni-10100
      type: l2vni            # エントリ側で L2VNI / L3VNI を区別
      vni: 10100
      vlans: [vlan-100]
      vteps: [vtep-leaf1-leaf2]

layer3:
  interfaces:
    - { id: leaf1-lo, node: leaf1, name: lo, ip: 10.0.0.1/32 }
    - { id: leaf2-lo, node: leaf2, name: lo, ip: 10.0.0.2/32 }
    - { id: leaf1-swp2-l3, node: leaf1, name: swp2, attaches_to: {interface: leaf1-swp2}, ip: 10.1.0.0/31 }
    - { id: leaf2-swp2-l3, node: leaf2, name: swp2, attaches_to: {interface: leaf2-swp2}, ip: 10.1.0.1/31 }

control_plane:
  isis:
    - id: isis-core
      nodes: [{ node: leaf1 }, { node: leaf2 }]

  routing_neighbors:
    - id: isis-adj-leaf1-leaf2
      type: isis
      instance: isis-core
      from: { node: leaf1, interface: leaf1-swp2 }
      to:   { node: leaf2, interface: leaf2-swp2 }
      # ↓ 改名後 (案 a): 下線区切り `level_2`。`level_1` / `level_2` / `level_all` の 3 択。
      level: level_2
