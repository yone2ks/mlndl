# 4 leaf の EVPN-VXLAN (MLAG 1 組 + L2VNI 2 つ + L3VNI 1 つ + BGP)
#
# 書いたもの:
#   - spine x2, leaf x4 (leaf1 / leaf2 が MLAG ペア、leaf3 / leaf4 は単独)
#   - server1 を leaf1 / leaf2 に MLAG で、server3 を leaf3 に、server4 を leaf4 に接続
#   - VLAN 10 (tenant-a) と VLAN 20 (tenant-a) を L2VNI 10010 / 10020 に。
#     SVI は 4 leaf とも anycast gateway (同じ IP)
#   - L3VNI 10900 (vrf-tenant-a、symmetric IRB)
#   - underlay は直結の /31 の eBGP、overlay はループバックどうしの eBGP multihop (EVPN)
#
# この例は docs/reference/ の中だけを見て書いた。書きにくかった点は release-1.0-stocktake.md へ。
ndl_version: "1.0"

meta:
  name: evpn-4leaf-mlag
  description: 2 spines, 4 leaves (MLAG pair leaf1/leaf2), 2 L2VNI + 1 L3VNI (symmetric IRB), eBGP underlay + eBGP overlay
  network_types: [l1-physical, l2-network, l3-unicast]

layer1:
  nodes:
    - {id: spine1,  implementation: vm,       role: spine,  device_type: cumulus_linux}
    - {id: spine2,  implementation: vm,       role: spine,  device_type: cumulus_linux}
    - {id: leaf1,   implementation: vm,       role: leaf,   device_type: cumulus_linux}
    - {id: leaf2,   implementation: vm,       role: leaf,   device_type: cumulus_linux}
    - {id: leaf3,   implementation: vm,       role: leaf,   device_type: cumulus_linux}
    - {id: leaf4,   implementation: vm,       role: leaf,   device_type: cumulus_linux}
    - {id: server1, implementation: physical, role: server}
    - {id: server3, implementation: physical, role: server}
    - {id: server4, implementation: physical, role: server}

  interfaces:
    # ── spine1 ──────────────────────────────────────────────────────────
    - {id: spine1-swp1, node: spine1, name: swp1}   # → leaf1
    - {id: spine1-swp2, node: spine1, name: swp2}   # → leaf2
    - {id: spine1-swp3, node: spine1, name: swp3}   # → leaf3
    - {id: spine1-swp4, node: spine1, name: swp4}   # → leaf4
    # ── spine2 ──────────────────────────────────────────────────────────
    - {id: spine2-swp1, node: spine2, name: swp1}   # → leaf1
    - {id: spine2-swp2, node: spine2, name: swp2}   # → leaf2
    - {id: spine2-swp3, node: spine2, name: swp3}   # → leaf3
    - {id: spine2-swp4, node: spine2, name: swp4}   # → leaf4
    # ── leaf1 (MLAG) ────────────────────────────────────────────────────
    - {id: leaf1-swp51, node: leaf1, name: swp51}   # → spine1
    - {id: leaf1-swp52, node: leaf1, name: swp52}   # → spine2
    - {id: leaf1-swp49, node: leaf1, name: swp49}   # peer-link
    - {id: leaf1-swp50, node: leaf1, name: swp50}   # peer-link
    - {id: leaf1-swp1,  node: leaf1, name: swp1}    # → server1 (MLAG)
    # ── leaf2 (MLAG) ────────────────────────────────────────────────────
    - {id: leaf2-swp51, node: leaf2, name: swp51}   # → spine1
    - {id: leaf2-swp52, node: leaf2, name: swp52}   # → spine2
    - {id: leaf2-swp49, node: leaf2, name: swp49}   # peer-link
    - {id: leaf2-swp50, node: leaf2, name: swp50}   # peer-link
    - {id: leaf2-swp1,  node: leaf2, name: swp1}    # → server1 (MLAG)
    # ── leaf3 ───────────────────────────────────────────────────────────
    - {id: leaf3-swp51, node: leaf3, name: swp51}   # → spine1
    - {id: leaf3-swp52, node: leaf3, name: swp52}   # → spine2
    - {id: leaf3-swp1,  node: leaf3, name: swp1}    # → server3
    # ── leaf4 ───────────────────────────────────────────────────────────
    - {id: leaf4-swp51, node: leaf4, name: swp51}   # → spine1
    - {id: leaf4-swp52, node: leaf4, name: swp52}   # → spine2
    - {id: leaf4-swp1,  node: leaf4, name: swp1}    # → server4
    # ── servers ─────────────────────────────────────────────────────────
    - {id: server1-eth0, node: server1, name: eth0}
    - {id: server1-eth1, node: server1, name: eth1}
    - {id: server3-eth0, node: server3, name: eth0}
    - {id: server4-eth0, node: server4, name: eth0}

  links:
    # ── spine ↔ leaf (underlay /31) ─────────────────────────────────────
    - {id: link-spine1-leaf1, endpoints: [spine1-swp1, leaf1-swp51], link_speed: 10G, link_role: underlay}
    - {id: link-spine1-leaf2, endpoints: [spine1-swp2, leaf2-swp51], link_speed: 10G, link_role: underlay}
    - {id: link-spine1-leaf3, endpoints: [spine1-swp3, leaf3-swp51], link_speed: 10G, link_role: underlay}
    - {id: link-spine1-leaf4, endpoints: [spine1-swp4, leaf4-swp51], link_speed: 10G, link_role: underlay}
    - {id: link-spine2-leaf1, endpoints: [spine2-swp1, leaf1-swp52], link_speed: 10G, link_role: underlay}
    - {id: link-spine2-leaf2, endpoints: [spine2-swp2, leaf2-swp52], link_speed: 10G, link_role: underlay}
    - {id: link-spine2-leaf3, endpoints: [spine2-swp3, leaf3-swp52], link_speed: 10G, link_role: underlay}
    - {id: link-spine2-leaf4, endpoints: [spine2-swp4, leaf4-swp52], link_speed: 10G, link_role: underlay}
    # ── MLAG peer-link (leaf1 ↔ leaf2) ──────────────────────────────────
    - {id: link-peer-1, endpoints: [leaf1-swp49, leaf2-swp49], link_speed: 10G, link_role: peer-link}
    - {id: link-peer-2, endpoints: [leaf1-swp50, leaf2-swp50], link_speed: 10G, link_role: peer-link}
    # ── leaf ↔ server (access) ──────────────────────────────────────────
    - {id: link-leaf1-server1, endpoints: [leaf1-swp1, server1-eth0], link_speed: 10G, link_role: access}
    - {id: link-leaf2-server1, endpoints: [leaf2-swp1, server1-eth1], link_speed: 10G, link_role: access}
    - {id: link-leaf3-server3, endpoints: [leaf3-swp1, server3-eth0], link_speed: 10G, link_role: access}
    - {id: link-leaf4-server4, endpoints: [leaf4-swp1, server4-eth0], link_speed: 10G, link_role: access}

  lag:
    # peer-link は機器ごとの普通の LAG (ADR-0023 D6)
    - {id: lag-leaf1-peer, node: leaf1, name: peerlink, members: [leaf1-swp49, leaf1-swp50], lacp: {mode: active, min_links: 1}}
    - {id: lag-leaf2-peer, node: leaf2, name: peerlink, members: [leaf2-swp49, leaf2-swp50], lacp: {mode: active, min_links: 1}}
    # MLAG server1 向けの bond (機器ごとに 1 つずつ)
    - {id: lag-leaf1-server1, node: leaf1, name: bond1, members: [leaf1-swp1], lacp: {mode: active, min_links: 1}}
    - {id: lag-leaf2-server1, node: leaf2, name: bond1, members: [leaf2-swp1], lacp: {mode: active, min_links: 1}}
    # server1 側の bond
    - {id: lag-server1-bond0, node: server1, name: bond0, members: [server1-eth0, server1-eth1], lacp: {mode: active, min_links: 1}}

  ethernet_segments:
    # leaf1 / leaf2 の bond1 を server1 から 1 本に見せる (ADR-0023)
    - {id: es-server1, members: [{lag: lag-leaf1-server1}, {lag: lag-leaf2-server1}]}

layer2:
  vlans:
    - id: vlan-10
      vlan_id: 10
      name: tenant-a-web
      trunk_ports:
        - {ethernet_segment: es-server1}   # 1 行で leaf1 / leaf2 の両方
        - {interface: leaf3-swp1}
      access_ports:
        - {interface: server3-eth0}        # server3 は VLAN 10 の access
    - id: vlan-20
      vlan_id: 20
      name: tenant-a-app
      trunk_ports:
        - {ethernet_segment: es-server1}
        - {interface: leaf4-swp1}
      access_ports:
        - {interface: server4-eth0}        # server4 は VLAN 20 の access

  vteps:
    # MLAG ペア leaf1 / leaf2 が共有する VTEP。共有アドレスは `address` に書く (primary とは別)
    - {id: vtep-leaf1-leaf2, sources: [leaf1-lo1, leaf2-lo1], address: 10.0.100.12/32}
    # 単独の leaf。sources が 1 つなら address は省略でき、その L3 IF の ip になる
    - {id: vtep-leaf3, sources: [leaf3-lo1]}
    - {id: vtep-leaf4, sources: [leaf4-lo1]}

  vxlan:
    - id: vni-10010
      type: l2vni
      vni: 10010
      vlans: [vlan-10]
      vteps: [vtep-leaf1-leaf2, vtep-leaf3]   # leaf4 は VLAN 10 を持たない
    - id: vni-10020
      type: l2vni
      vni: 10020
      vlans: [vlan-20]
      vteps: [vtep-leaf1-leaf2, vtep-leaf4]   # leaf3 は VLAN 20 を持たない
    - id: vni-10900
      type: l3vni
      vni: 10900
      vrf: vrf-tenant-a
      irb_mode: symmetric

layer3:
  vrfs:
    - {id: vrf-default}
    - id: vrf-tenant-a
      rd: "65001:100"
      l3vni: vni-10900
      route_targets:
        import: ["65001:100"]
        export: ["65001:100"]

  interfaces:
    # ── ループバック ─────────────────────────────────────────────────
    #   lo (router-id / BGP の update-source) と lo1 (VTEP の sources)
    - {id: spine1-lo, node: spine1, name: lo, ip: 10.0.0.1/32}
    - {id: spine2-lo, node: spine2, name: lo, ip: 10.0.0.2/32}
    - {id: leaf1-lo,  node: leaf1,  name: lo, ip: 10.0.0.11/32}
    - {id: leaf2-lo,  node: leaf2,  name: lo, ip: 10.0.0.12/32}
    - {id: leaf3-lo,  node: leaf3,  name: lo, ip: 10.0.0.13/32}
    - {id: leaf4-lo,  node: leaf4,  name: lo, ip: 10.0.0.14/32}
    # VTEP の sources。MLAG ペアは loopback の secondary でアドレスを共有するが、
    # MLNDL は secondary を書かず、共有アドレスは VTEP の `address` に書く (primary と別の値)
    - {id: leaf1-lo1, node: leaf1, name: lo1, ip: 10.0.1.11/32}
    - {id: leaf2-lo1, node: leaf2, name: lo1, ip: 10.0.1.112/32}
    - {id: leaf3-lo1, node: leaf3, name: lo1, ip: 10.0.1.13/32}
    - {id: leaf4-lo1, node: leaf4, name: lo1, ip: 10.0.1.14/32}

    # ── spine ↔ leaf P2P (/31) ──────────────────────────────────────
    - {id: spine1-swp1-l3, node: spine1, name: swp1, ip: 10.1.0.0/31, vrf: vrf-default, attaches_to: {interface: spine1-swp1}}
    - {id: spine1-swp2-l3, node: spine1, name: swp2, ip: 10.1.0.2/31, vrf: vrf-default, attaches_to: {interface: spine1-swp2}}
    - {id: spine1-swp3-l3, node: spine1, name: swp3, ip: 10.1.0.4/31, vrf: vrf-default, attaches_to: {interface: spine1-swp3}}
    - {id: spine1-swp4-l3, node: spine1, name: swp4, ip: 10.1.0.6/31, vrf: vrf-default, attaches_to: {interface: spine1-swp4}}
    - {id: spine2-swp1-l3, node: spine2, name: swp1, ip: 10.1.0.8/31, vrf: vrf-default, attaches_to: {interface: spine2-swp1}}
    - {id: spine2-swp2-l3, node: spine2, name: swp2, ip: 10.1.0.10/31, vrf: vrf-default, attaches_to: {interface: spine2-swp2}}
    - {id: spine2-swp3-l3, node: spine2, name: swp3, ip: 10.1.0.12/31, vrf: vrf-default, attaches_to: {interface: spine2-swp3}}
    - {id: spine2-swp4-l3, node: spine2, name: swp4, ip: 10.1.0.14/31, vrf: vrf-default, attaches_to: {interface: spine2-swp4}}
    - {id: leaf1-swp51-l3, node: leaf1, name: swp51, ip: 10.1.0.1/31,  vrf: vrf-default, attaches_to: {interface: leaf1-swp51}}
    - {id: leaf1-swp52-l3, node: leaf1, name: swp52, ip: 10.1.0.9/31,  vrf: vrf-default, attaches_to: {interface: leaf1-swp52}}
    - {id: leaf2-swp51-l3, node: leaf2, name: swp51, ip: 10.1.0.3/31,  vrf: vrf-default, attaches_to: {interface: leaf2-swp51}}
    - {id: leaf2-swp52-l3, node: leaf2, name: swp52, ip: 10.1.0.11/31, vrf: vrf-default, attaches_to: {interface: leaf2-swp52}}
    - {id: leaf3-swp51-l3, node: leaf3, name: swp51, ip: 10.1.0.5/31,  vrf: vrf-default, attaches_to: {interface: leaf3-swp51}}
    - {id: leaf3-swp52-l3, node: leaf3, name: swp52, ip: 10.1.0.13/31, vrf: vrf-default, attaches_to: {interface: leaf3-swp52}}
    - {id: leaf4-swp51-l3, node: leaf4, name: swp51, ip: 10.1.0.7/31,  vrf: vrf-default, attaches_to: {interface: leaf4-swp51}}
    - {id: leaf4-swp52-l3, node: leaf4, name: swp52, ip: 10.1.0.15/31, vrf: vrf-default, attaches_to: {interface: leaf4-swp52}}

    # ── anycast gateway (4 leaf とも同じ IP) ─────────────────────────
    - {id: leaf1-vlan-10, node: leaf1, name: Vlan10, attaches_to: {vlan: vlan-10}, ip: 192.168.10.1/24, vrf: vrf-tenant-a, gateway_redundancy: [{mode: anycast_gateway}]}
    - {id: leaf2-vlan-10, node: leaf2, name: Vlan10, attaches_to: {vlan: vlan-10}, ip: 192.168.10.1/24, vrf: vrf-tenant-a, gateway_redundancy: [{mode: anycast_gateway}]}
    - {id: leaf3-vlan-10, node: leaf3, name: Vlan10, attaches_to: {vlan: vlan-10}, ip: 192.168.10.1/24, vrf: vrf-tenant-a, gateway_redundancy: [{mode: anycast_gateway}]}
    - {id: leaf1-vlan-20, node: leaf1, name: Vlan20, attaches_to: {vlan: vlan-20}, ip: 192.168.20.1/24, vrf: vrf-tenant-a, gateway_redundancy: [{mode: anycast_gateway}]}
    - {id: leaf2-vlan-20, node: leaf2, name: Vlan20, attaches_to: {vlan: vlan-20}, ip: 192.168.20.1/24, vrf: vrf-tenant-a, gateway_redundancy: [{mode: anycast_gateway}]}
    - {id: leaf4-vlan-20, node: leaf4, name: Vlan20, attaches_to: {vlan: vlan-20}, ip: 192.168.20.1/24, vrf: vrf-tenant-a, gateway_redundancy: [{mode: anycast_gateway}]}

    # ── サーバーの IP (VLAN の端点として、validator が照合する) ─────
    - {id: server1-bond0-l3, node: server1, name: bond0, attaches_to: {lag: lag-server1-bond0}, ip: 192.168.10.11/24}
    - {id: server3-eth0-l3,  node: server3, name: eth0,  attaches_to: {interface: server3-eth0}, ip: 192.168.10.13/24}
    - {id: server4-eth0-l3,  node: server4, name: eth0,  attaches_to: {interface: server4-eth0}, ip: 192.168.20.14/24}

control_plane:
  # underlay は直結の /31 の eBGP、overlay はループバックどうしの eBGP multihop
  bgp:
    - id: bgp-default
      nodes:
        - {node: spine1, local_as: 65000}
        - {node: spine2, local_as: 65000}
        - {node: leaf1,  local_as: 65001}
        - {node: leaf2,  local_as: 65002}
        - {node: leaf3,  local_as: 65003}
        - {node: leaf4,  local_as: 65004}

  routing_neighbors:
    # ── underlay (直結の /31 どうし) ─────────────────────────────────
    - {id: bgp-peer-spine1-leaf1, type: bgp, from: {node: spine1, update_source: spine1-swp1-l3}, to: {node: leaf1, update_source: leaf1-swp51-l3}, address_families: [ipv4_unicast]}
    - {id: bgp-peer-spine1-leaf2, type: bgp, from: {node: spine1, update_source: spine1-swp2-l3}, to: {node: leaf2, update_source: leaf2-swp51-l3}, address_families: [ipv4_unicast]}
    - {id: bgp-peer-spine1-leaf3, type: bgp, from: {node: spine1, update_source: spine1-swp3-l3}, to: {node: leaf3, update_source: leaf3-swp51-l3}, address_families: [ipv4_unicast]}
    - {id: bgp-peer-spine1-leaf4, type: bgp, from: {node: spine1, update_source: spine1-swp4-l3}, to: {node: leaf4, update_source: leaf4-swp51-l3}, address_families: [ipv4_unicast]}
    - {id: bgp-peer-spine2-leaf1, type: bgp, from: {node: spine2, update_source: spine2-swp1-l3}, to: {node: leaf1, update_source: leaf1-swp52-l3}, address_families: [ipv4_unicast]}
    - {id: bgp-peer-spine2-leaf2, type: bgp, from: {node: spine2, update_source: spine2-swp2-l3}, to: {node: leaf2, update_source: leaf2-swp52-l3}, address_families: [ipv4_unicast]}
    - {id: bgp-peer-spine2-leaf3, type: bgp, from: {node: spine2, update_source: spine2-swp3-l3}, to: {node: leaf3, update_source: leaf3-swp52-l3}, address_families: [ipv4_unicast]}
    - {id: bgp-peer-spine2-leaf4, type: bgp, from: {node: spine2, update_source: spine2-swp4-l3}, to: {node: leaf4, update_source: leaf4-swp52-l3}, address_families: [ipv4_unicast]}
    # ── overlay (ループバックどうし。EVPN) ──────────────────────────
    - {id: bgp-peer-spine1-leaf1-overlay, type: bgp, from: {node: spine1, update_source: spine1-lo}, to: {node: leaf1, update_source: leaf1-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine1-leaf2-overlay, type: bgp, from: {node: spine1, update_source: spine1-lo}, to: {node: leaf2, update_source: leaf2-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine1-leaf3-overlay, type: bgp, from: {node: spine1, update_source: spine1-lo}, to: {node: leaf3, update_source: leaf3-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine1-leaf4-overlay, type: bgp, from: {node: spine1, update_source: spine1-lo}, to: {node: leaf4, update_source: leaf4-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine2-leaf1-overlay, type: bgp, from: {node: spine2, update_source: spine2-lo}, to: {node: leaf1, update_source: leaf1-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine2-leaf2-overlay, type: bgp, from: {node: spine2, update_source: spine2-lo}, to: {node: leaf2, update_source: leaf2-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine2-leaf3-overlay, type: bgp, from: {node: spine2, update_source: spine2-lo}, to: {node: leaf3, update_source: leaf3-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine2-leaf4-overlay, type: bgp, from: {node: spine2, update_source: spine2-lo}, to: {node: leaf4, update_source: leaf4-lo}, address_families: [l2vpn_evpn]}
