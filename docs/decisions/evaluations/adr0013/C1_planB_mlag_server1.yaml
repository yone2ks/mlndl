# 案 B: interface: に LAG id を許す / LAG のとき node 省略可 (導出) / MLAG は 1 エントリ
#
# 書きやすさ:
# - MLAG は 1 行で済む。node は lag.nodes から導出 ([leaf1, leaf2] の両方に属する)。
# - 「同一フィールド interface:」で L1 IF と LAG を受けるので VLAN スキーマが膨らまない。
# 読み手の違和感:
# - interface: という名前で LAG を受けるのが素朴な期待とズレるが、ADR-0012 の
#   attaches_to: {interface: <L1 IF または LAG>} と同じ合流で、プロジェクト内では一貫。

ndl_version: "1.0"

meta:
  name: c1-planB-mlag-server1
  network_types: [l1-physical, l2-network]

layer1:
  nodes:
    - { id: leaf1, implementation: vm, role: leaf }
    - { id: leaf2, implementation: vm, role: leaf }
    - { id: server1, implementation: physical, role: server }

  interfaces:
    - { id: leaf1-swp1, node: leaf1, name: swp1 }
    - { id: leaf2-swp1, node: leaf2, name: swp1 }
    - { id: server1-eth0, node: server1, name: eth0 }
    - { id: server1-eth1, node: server1, name: eth1 }

  links:
    - { id: link-leaf1-server1, endpoints: [leaf1-swp1, server1-eth0], link_role: access }
    - { id: link-leaf2-server1, endpoints: [leaf2-swp1, server1-eth1], link_role: access }

  lag:
    - id: lag-mlag-server1
      type: mlag
      nodes: [leaf1, leaf2]
      members: [leaf1-swp1, leaf2-swp1]
      lacp: {mode: active, min_links: 1}
      peer_link: lag-peer-link
      peer_link_interface: peerlink.4094

    - id: lag-peer-link
      type: lacp
      node: leaf1
      members: []
      lacp: {mode: active}

layer2:
  vlans:
    - id: vlan-100
      vlan_id: 100
      trunk_ports:
        # 案 B: MLAG を 1 行で書き、node は lag.nodes から導出
        - {interface: lag-mlag-server1}
