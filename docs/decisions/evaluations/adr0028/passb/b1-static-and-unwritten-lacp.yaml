# ADR-0028 Pass B: LACP の既定値をなくしたあとの 4 つの書き方 (valid のつもり)
#
# ドラフトのとおりなら: valid
#   D1 で `layer1.lag` → `layer1.lags` に改名ずみ
#   D4 で LacpConfig.mode / min_links の既定値をなくした。書かなければ「書いていない」
#
# 何を確かめるためのファイルか:
#   同じトポロジーに 4 つの LAG を並べ、`lacp` の書き方の違いが読み手に伝わるかを見る。
#     1) lag-leaf1-bond1 : `lacp` キーごと書かない  — LACP の設定は「書いていない」
#     2) lag-leaf1-bond2 : `lacp: {mode: on}`      — 静的な LAG (LACP を張らないことの明示)
#     3) lag-leaf1-bond3 : `lacp: {mode: active}`  — LACP アクティブ
#     4) lag-leaf1-bond4 : `lacp: {min_links: 2}`  — min_links だけ指定 (mode は書いていない)
#
# 読み手に 4 つの違いが伝わるかの評価 (このファイルの中で言える範囲):
#
#   - 1) と 2) の違いは **意図があるかないか**。
#     1) は「LACP のことは何も書いていない」で、ツール (ndl-viz など) は静的とも
#     active とも決めつけない。装置側の既定値に委ねる、という読み方になる。
#     2) は「LACP を張らない」と明示する書き方で、人には読み取りやすい。
#     ただし、`mode: on` が静的だという意味は Cisco の慣用 (LACP 不使用) から
#     来ており、知らない読み手は「オン=有効 = アクティブ」と読み違えうる。
#     Literal の 3 つの値 (active / passive / on) の意味は docs/reference/ に注記が要る。
#
#   - 3) と 4) は両方「LACP を使うつもり」だが、
#     3) は mode だけ、4) は min_links だけ、という「片方だけ書く」が許される。
#     「mode を書かずに min_links だけ書く」が意味を持つかは微妙 (LACP を張るのか
#     張らないのかが決まっていないのに、最低メンバー数だけが決まる)。
#     D4 の規則では valid だが、「片方だけで valid」を人が読むと迷いやすい。
#     ADR-0028 の文を見ても「書くなら mode か min_links を書く」で、mode の有無で
#     min_links の意味が変わるかは書かれていない。これはドラフトの隙間として
#     報告する。
#
# 検証は改名 (lags → lag) を戻したコピーを想定。
# 公開リポジトリなので個人名・絶対パスは書かない。

ndl_version: "1.0"

meta:
  name: adr0028-b1-static-and-unwritten-lacp

layer1:
  nodes:
    - { id: leaf1, name: Leaf-1, implementation: vm, role: leaf, device_type: cumulus_linux }
    - { id: server1, name: Server-1, implementation: physical, role: server }
    - { id: server2, name: Server-2, implementation: physical, role: server }
    - { id: server3, name: Server-3, implementation: physical, role: server }
    - { id: server4, name: Server-4, implementation: physical, role: server }

  interfaces:
    # leaf1 の 4 つの LAG の member。bond1 / bond2 / bond3 は 1 メンバー、bond4 だけ 2 メンバー
    - { id: leaf1-swp1, node: leaf1, name: swp1 }  # → server1-eth0
    - { id: leaf1-swp2, node: leaf1, name: swp2 }  # → server2-eth0
    - { id: leaf1-swp3, node: leaf1, name: swp3 }  # → server3-eth0
    - { id: leaf1-swp4, node: leaf1, name: swp4 }  # → server4-eth0
    - { id: leaf1-swp5, node: leaf1, name: swp5 }  # → server4-eth1
    - { id: server1-eth0, node: server1, name: eth0 }
    - { id: server2-eth0, node: server2, name: eth0 }
    - { id: server3-eth0, node: server3, name: eth0 }
    - { id: server4-eth0, node: server4, name: eth0 }
    - { id: server4-eth1, node: server4, name: eth1 }

  links:
    - { id: link-leaf1-server1, endpoints: [leaf1-swp1, server1-eth0], link_speed: 10G, link_role: access }
    - { id: link-leaf1-server2, endpoints: [leaf1-swp2, server2-eth0], link_speed: 10G, link_role: access }
    - { id: link-leaf1-server3, endpoints: [leaf1-swp3, server3-eth0], link_speed: 10G, link_role: access }
    - { id: link-leaf1-server4-a, endpoints: [leaf1-swp4, server4-eth0], link_speed: 10G, link_role: access }
    - { id: link-leaf1-server4-b, endpoints: [leaf1-swp5, server4-eth1], link_speed: 10G, link_role: access }

  # ↓ D1: 改名後の複数形
  lags:
    # 1) lacp キーごと書かない。D4 の「書かなければ書いていない」
    - id: lag-leaf1-bond1
      node: leaf1
      name: bond1
      members: [leaf1-swp1]

    # 2) 静的 LAG を明示。LACP は張らない (mode: on)
    - id: lag-leaf1-bond2
      node: leaf1
      name: bond2
      members: [leaf1-swp2]
      lacp: { mode: on }

    # 3) LACP アクティブ。mode だけ書く
    - id: lag-leaf1-bond3
      node: leaf1
      name: bond3
      members: [leaf1-swp3]
      lacp: { mode: active }

    # 4) min_links だけ書く (mode は書かない)。min_links は 2 なのでメンバーも 2 つ
    - id: lag-leaf1-bond4
      node: leaf1
      name: bond4
      members: [leaf1-swp4, leaf1-swp5]
      lacp: { min_links: 2 }
