# P1 (ADR-0017 Pass C): 3 拠点以上の広域イーサ (E-LAN) で OSPF を張る構成
#
# 目的:
#   - 広域イーサを「箱」(role: provider-network) で書くとき、拠点のルーターどうしの
#     OSPF が今の validator で通るかを確かめる。
#   - 通る (OSPF には ADR-0010 D7 の通り道の検査が走らない。評価メモ「Pass B のあとに
#     分かったこと」の確認) ことと、OSPF 自体は box をはさんでも書けることを示す。
#   - ただし 3 拠点以上の広域イーサは L3 的にはマルチアクセスであり、
#     ADR-0010 D8 の OSPF ポイントツーポイント前提の範囲外。
#     Pass C で ADR-0017 に書くべき注意: この構成を書けること自体は validator が許すが、
#     mlndl の構文では DR/BDR・network type を表現しない。
#
# 構成:
#   tokyo-rtr (10.100.0.1/29) ─┐
#   osaka-rtr (10.100.0.2/29) ─┼─ KDDI 広域イーサ (E-LAN。マルチポイント)
#   nagoya-rtr (10.100.0.3/29) ┘
#   OSPF Area 0.0.0.0。full-mesh の隣接を 3 本書く。

ndl_version: "1.0"

meta:
  name: P1-elan-ospf-3sites
  description: 3 拠点を広域イーサ (E-LAN) で結び、拠点のルーターどうしで OSPF Area 0 を張る
  network_types: [l1-physical, l3-unicast]

layer1:
  nodes:
    - {id: tokyo-rtr,  role: border, implementation: physical, labels: {site: tokyo}}
    - {id: osaka-rtr,  role: border, implementation: physical, labels: {site: osaka}}
    - {id: nagoya-rtr, role: border, implementation: physical, labels: {site: nagoya}}

    - id: net-kddi-elan
      name: KDDI 広域イーサ (WE-LAN-300)
      role: provider-network
      description: >-
        KDDI 広域イーサネット。契約 WE-LAN-300、マルチポイント型 (E-LAN)。
        3 拠点が同一のブロードキャストセグメントに同居する。最大フレーム 1522 bytes。

  interfaces:
    - {id: tokyo-rtr-ge0,  node: tokyo-rtr,  name: Ge0/0}
    - {id: osaka-rtr-ge0,  node: osaka-rtr,  name: Ge0/0}
    - {id: nagoya-rtr-ge0, node: nagoya-rtr, name: Ge0/0}
    - {id: net-kddi-elan-tokyo,  node: net-kddi-elan, name: tokyo}
    - {id: net-kddi-elan-osaka,  node: net-kddi-elan, name: osaka}
    - {id: net-kddi-elan-nagoya, node: net-kddi-elan, name: nagoya}

  links:
    - {id: link-tokyo-elan,  endpoints: [tokyo-rtr-ge0,  net-kddi-elan-tokyo],  link_speed: 1G,
       description: "東京 アクセス回線。回線 ID WE-LAN-300-T、契約帯域 1G"}
    - {id: link-osaka-elan,  endpoints: [osaka-rtr-ge0,  net-kddi-elan-osaka],  link_speed: 1G,
       description: "大阪 アクセス回線。回線 ID WE-LAN-300-O、契約帯域 1G"}
    - {id: link-nagoya-elan, endpoints: [nagoya-rtr-ge0, net-kddi-elan-nagoya], link_speed: 500M,
       description: "名古屋 アクセス回線。回線 ID WE-LAN-300-N、契約帯域 500M"}

layer3:
  # 3 ノードは同じ /29 セグメントの別アドレスを持つ (E-LAN なので L2 で疎通する)
  interfaces:
    - {id: tokyo-rtr-ge0-l3,  node: tokyo-rtr,  name: Ge0/0, ip: 10.100.0.1/29, attaches_to: {interface: tokyo-rtr-ge0}}
    - {id: osaka-rtr-ge0-l3,  node: osaka-rtr,  name: Ge0/0, ip: 10.100.0.2/29, attaches_to: {interface: osaka-rtr-ge0}}
    - {id: nagoya-rtr-ge0-l3, node: nagoya-rtr, name: Ge0/0, ip: 10.100.0.3/29, attaches_to: {interface: nagoya-rtr-ge0}}
    - {id: tokyo-rtr-lo,  node: tokyo-rtr,  name: lo0, ip: 10.255.0.1/32}
    - {id: osaka-rtr-lo,  node: osaka-rtr,  name: lo0, ip: 10.255.0.2/32}
    - {id: nagoya-rtr-lo, node: nagoya-rtr, name: lo0, ip: 10.255.0.3/32}

control_plane:
  ospf:
    - id: ospf-default
      nodes:
        - {node: tokyo-rtr}
        - {node: osaka-rtr}
        - {node: nagoya-rtr}

  routing_neighbors:
    # E-LAN のフルメッシュ。1 つのブロードキャストセグメント上の隣接関係を
    # 2 ノードずつ 3 ペアで書く (ADR-0010 D8 のポイントツーポイント形)。
    # 実機の運用では DR/BDR 選出だが、mlndl にはその概念がないので「どの 2 ノードが
    # 隣接関係を持つか」を 3 本の P2P 隣接として記述するしかない。
    - {id: ospf-adj-tokyo-osaka,  type: ospf, area: "0.0.0.0",
       from: {node: tokyo-rtr, interface: tokyo-rtr-ge0-l3},
       to:   {node: osaka-rtr, interface: osaka-rtr-ge0-l3}}
    - {id: ospf-adj-tokyo-nagoya, type: ospf, area: "0.0.0.0",
       from: {node: tokyo-rtr,  interface: tokyo-rtr-ge0-l3},
       to:   {node: nagoya-rtr, interface: nagoya-rtr-ge0-l3}}
    - {id: ospf-adj-osaka-nagoya, type: ospf, area: "0.0.0.0",
       from: {node: osaka-rtr,  interface: osaka-rtr-ge0-l3},
       to:   {node: nagoya-rtr, interface: nagoya-rtr-ge0-l3}}

# 期待される validator 出力:
#   errors 0, warnings 0 (OK)
#
# 根拠 (validator.py の読みから):
#   - OSPF の隣接には bgp_session_views の transport_mismatch 検査が走らない。
#     L3 IF の attaches_to がそれぞれ別の L1 リンク (拠点 → 箱) に載っていても、
#     「両端が同じリンクの上にない」という error にはならない。
#   - 両端は OspfInsideEndpoint のみ (OspfOutsideEndpoint は存在しない)。箱の中の
#     装置を OSPF の相手にすることはできないので、拠点どうしで書くほかない。
#   - 同じ両端のセッション重複チェックは BGP の bgp_session_views でしか走らない。
#     したがってフルメッシュ 3 本も通る。
#
# ndl-viz:
#   - 箱 "KDDI 広域イーサ (WE-LAN-300)" を雲として描く。
#   - 3 本の OSPF 隣接は、拠点どうしを結ぶ overlay の点線 (または隣接の線) として
#     描くことになる。雲をはさんでいる見た目になるが、言語としてはそれが OSPF の端。
#
# Pass C で ADR-0017 に書くべきこと:
#   - E-LAN の OSPF は validator が通してくれるが、DR/BDR・network type (point-to-point /
#     broadcast / non-broadcast) は構文に出さない。これらは機器のコンフィグに属する運用情報で、
#     ADR-0005 D4 補則「表現の指針」(方式名は構文に入れない) に沿う。
#   - 3 拠点以上を 1 本の箱に収めるとき、OSPF の隣接を全ペア書くか、代表 1 本で済ますかは
#     書き手の判断になる。ADR-0017 に例として「3 ペア書く」ことを示しておくと迷いが減る。
