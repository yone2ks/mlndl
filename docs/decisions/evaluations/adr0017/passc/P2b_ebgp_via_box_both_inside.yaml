# P2b (ADR-0017 Pass C): P2a と対の invalid 版。両端を node で書くと transport_mismatch で error。
#
# 「相手は自分の機器なのだから node で書きたい」という素直な書き方。
# しかし両端の update_source が指す L3 IF の基盤 (L1 リンク) が別物 (link-tokyo-wideether と
# link-osaka-wideether) なので、ADR-0010 D7 の通り道の検査で transport_mismatch になる。
#
# Pass C の確認ポイント:
#   - 「箱をはさむ両端 node の BGP」は現行構文では error になる。
#   - これが ADR-0017 ドラフト D5-2 で未解決とされた「次の ADR で扱う」問題の実例。
#   - D5-2 (d) (構文の追加) を次の ADR で扱うまでの間は、P2a の書き方で回避する。

ndl_version: "1.0"

meta:
  name: P2b-ebgp-via-box-both-inside
  description: 広域イーサ越しに 2 拠点の eBGP を両端 node で書く (invalid)
  network_types: [l1-physical, l3-unicast]

layer1:
  nodes:
    - {id: tokyo-rtr, role: border, implementation: physical, labels: {site: tokyo}}
    - {id: osaka-rtr, role: border, implementation: physical, labels: {site: osaka}}

    - id: net-ntt-wideether
      name: NTT Com 広域イーサ (地域間 VPN-220)
      role: provider-network
      description: 2 拠点を結ぶ広域イーサ。契約 WE-220、ポイントツーポイント型

  interfaces:
    - {id: tokyo-rtr-ge0, node: tokyo-rtr, name: Ge0/0}
    - {id: osaka-rtr-ge0, node: osaka-rtr, name: Ge0/0}
    - {id: net-ntt-wideether-tokyo, node: net-ntt-wideether, name: tokyo}
    - {id: net-ntt-wideether-osaka, node: net-ntt-wideether, name: osaka}

  links:
    - {id: link-tokyo-wideether, endpoints: [tokyo-rtr-ge0, net-ntt-wideether-tokyo], link_speed: 1G}
    - {id: link-osaka-wideether, endpoints: [osaka-rtr-ge0, net-ntt-wideether-osaka], link_speed: 1G}

layer3:
  interfaces:
    - {id: tokyo-rtr-ge0-l3, node: tokyo-rtr, name: Ge0/0, ip: 10.100.0.1/30, attaches_to: {interface: tokyo-rtr-ge0}}
    - {id: osaka-rtr-ge0-l3, node: osaka-rtr, name: Ge0/0, ip: 10.100.0.2/30, attaches_to: {interface: osaka-rtr-ge0}}

control_plane:
  bgp:
    - id: bgp-default
      nodes:
        - {node: tokyo-rtr, local_as: 65001}
        - {node: osaka-rtr, local_as: 65002}

  routing_neighbors:
    # 両端とも BgpInsideEndpoint。tokyo-rtr-ge0-l3 は link-tokyo-wideether の上、
    # osaka-rtr-ge0-l3 は link-osaka-wideether の上。別の L1 リンクなので
    # transport_mismatch (ADR-0010 D7)。
    - {id: bgp-peer-tokyo-osaka, type: bgp,
       from: {node: tokyo-rtr, update_source: tokyo-rtr-ge0-l3},
       to:   {node: osaka-rtr, update_source: osaka-rtr-ge0-l3},
       address_families: [ipv4_unicast]}

# 期待される validator 出力:
#   ERROR  control_plane.routing_neighbors[0]:
#     両端の update_source ('tokyo-rtr-ge0-l3' と 'osaka-rtr-ge0-l3') が同じリンク /
#     LAG / VLAN の上にありません。直結のインターフェースどうしで張るなら、同じリンクの
#     両端を指してください (ADR-0010 D7)
#
# 根拠 (validator.py L808-L813):
#   _validate_control_plane → bgp_session_views → _transport で、両端の L3 IF の
#   基盤 (("l1", <link の L1 IF id>, None)) が食い違うと transport_mismatch = True。
