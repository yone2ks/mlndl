# 案 C: mtu を IF 側に移す。
#   C1: L1 IF に mtu (= 物理ポートの MTU)。VxLAN underlay 検査はこちらでできる (同じ L1 IF が複数リンクを持たないため)
#   C2: L3 IF に mtu (= IP MTU)。SVI や routed sub-IF の MTU を表現できるが、検査はやや遠い
# 下は C1 のパターン。VxLAN underlay 検査は「L1 IF.mtu の min(両端) >= 1550」に読み替える
ndl_version: "1.0"

meta:
  name: trial-c-on-if
  network_types: [l1-physical, l3-unicast]

layer1:
  nodes:
    - {id: spine1, implementation: vm, role: spine}
    - {id: leaf1,  implementation: vm, role: leaf}
    - {id: leaf2,  implementation: vm, role: leaf}
    - {id: host1,  implementation: vm, role: server}
    - {id: border1, implementation: physical, role: border}

  interfaces:
    # underlay の両端は mtu 9216 を "各ポートに" 書く → リンクごとに書くより冗長になりやすい
    - {id: spine1-swp1, node: spine1, name: swp1, mtu: 9216}
    - {id: spine1-swp2, node: spine1, name: swp2, mtu: 9216}
    - {id: leaf1-swp51, node: leaf1,  name: swp51, mtu: 9216}
    - {id: leaf2-swp51, node: leaf2,  name: swp51, mtu: 9216}
    - {id: leaf1-swp1,  node: leaf1,  name: swp1, mtu: 1500}
    - {id: host1-eth0,  node: host1,  name: eth0, mtu: 1500}
    - {id: border1-ge1, node: border1, name: ge1, mtu: 1500}
    - {id: border1-ge2, node: border1, name: ge2, mtu: 1500}

  links:
    # link 側には mtu は書かない
    - {id: link-spine1-leaf1, endpoints: [spine1-swp1, leaf1-swp51], link_speed: 10G, link_role: underlay}
    - {id: link-spine1-leaf2, endpoints: [spine1-swp2, leaf2-swp51], link_speed: 10G, link_role: underlay}
    - {id: link-leaf1-host1,  endpoints: [leaf1-swp1,  host1-eth0], link_speed: 1G,  link_role: access}
    - {id: link-border1-inet, endpoints: [border1-ge2, spine1-swp2], link_speed: 1G, link_role: uplink}

layer3:
  interfaces:
    - {id: leaf1-lo,  node: leaf1,  name: lo, ip: 10.0.0.1/32}
    - {id: leaf2-lo,  node: leaf2,  name: lo, ip: 10.0.0.2/32}
    - {id: border1-ge2-l3, node: border1, name: ge2, ip: 203.0.113.1/30, attaches_to: {interface: border1-ge2}}

  tunnel_interfaces:
    - {id: tunnel-border1-dc2, node: border1, type: gre,
       source: border1-ge2-l3, destination_ip: 198.51.100.1,
       ip: 172.31.0.1/30, mtu: 1476}
