# S3: 3 拠点を広域イーサで接続。同一 VLAN がストレッチする。
#
# ──────────────────────────────────────────────────────────────────────────
# 候補 A (L1Link 属性): 書けない (点対点のリンクを 3 本書けば 3 拠点メッシュ風に
#   見えるが、「同じ 1 本の広域イーサ」ではなくなる。VLAN が全拠点に届く意味も
#   うまく出ない)
# ──────────────────────────────────────────────────────────────────────────
#
# ──────────────────────────────────────────────────────────────────────────
# 候補 B (circuits): 1 つの circuit を 3 本の L1Link で参照する書き方が可能だが、
#   広域イーサが「multipoint な 1 本の L2 媒体」であることは依然書けない。
#   VLAN のストレッチは layer2.vlans の trunk_ports で 3 拠点のポートを並べる
#   ことで表せる (今の書き方そのまま)
# ──────────────────────────────────────────────────────────────────────────
#
# ──────────────────────────────────────────────────────────────────────────
# 候補 C (網 = 箱ノード): 広域イーサ網を 1 ノードにし、VLAN の trunk_ports に
#   拠点側ポートだけを並べる。網ノードは L2 透過として扱う。★ 推奨
# ──────────────────────────────────────────────────────────────────────────

ndl_version: "1.0"

meta:
  name: S3-wide-ether-C
  description: "候補 C: 3 拠点広域イーサ、VLAN 100 がストレッチ"
  network_types: [l1-physical, l2-network]

layer1:
  nodes:
    - {id: tokyo-sw,  role: core, implementation: physical, labels: {site: tokyo}}
    - {id: osaka-sw,  role: core, implementation: physical, labels: {site: osaka}}
    - {id: nagoya-sw, role: core, implementation: physical, labels: {site: nagoya}}

    - id: net-wideeth-ntt
      role: provider-network
      implementation: physical
      labels: {provider: ntt-com, service: wide-ethernet, vpn_id: WE-100}

  interfaces:
    - {id: tokyo-sw-ge0,  node: tokyo-sw,  name: Ge0/0}
    - {id: osaka-sw-ge0,  node: osaka-sw,  name: Ge0/0}
    - {id: nagoya-sw-ge0, node: nagoya-sw, name: Ge0/0}
    - {id: net-wideeth-ntt-tokyo,  node: net-wideeth-ntt, name: tokyo}
    - {id: net-wideeth-ntt-osaka,  node: net-wideeth-ntt, name: osaka}
    - {id: net-wideeth-ntt-nagoya, node: net-wideeth-ntt, name: nagoya}

  links:
    - {id: link-tokyo-wideeth,  endpoints: [tokyo-sw-ge0,  net-wideeth-ntt-tokyo],  link_speed: 1G, link_role: wan}
    - {id: link-osaka-wideeth,  endpoints: [osaka-sw-ge0,  net-wideeth-ntt-osaka],  link_speed: 1G, link_role: wan}
    - {id: link-nagoya-wideeth, endpoints: [nagoya-sw-ge0, net-wideeth-ntt-nagoya], link_speed: 1G, link_role: wan}

layer2:
  vlans:
    - id: vlan-100
      vlan_id: 100
      name: stretched-tenant
      # [書きにくさ] 広域イーサが L2 透過であることを前提に、拠点側ポート 3 つ
      # を trunk として並べる。網側のポート (net-wideeth-ntt-*) は書かない
      # (事業者網内のタグ運用は mlndl のスコープ外)。
      # しかし「網も L2 透過ノードだ」というなら本来は網側 3 ポートも trunk だ
      # という理屈になり、どこで切るかの規約が要る。
      trunk_ports:
        - {interface: tokyo-sw-ge0}
        - {interface: osaka-sw-ge0}
        - {interface: nagoya-sw-ge0}

# ──────────────────────────────────────────────────────────────────────────
# 候補 D: C と同じ (多地点かつ L2 透過なら網 = ノードが素直)
# ──────────────────────────────────────────────────────────────────────────
#
# ndl-viz: 網を雲で、3 拠点から雲へ 3 本の実線。雲内に "VLAN 100 stretched"
#   のラベル。各リンクに回線 ID を小さく出す (網ノードの labels に
#   拠点別キーで持たせるか、IF の description に書く)。
