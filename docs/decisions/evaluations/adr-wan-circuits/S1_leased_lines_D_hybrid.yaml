# S1 候補 D: 専用線 = リンク + 属性 (A)、網 = ノード (C) の使い分け
#
# S1 は「両端が自分で見える専用線」なので D では A と同一になる (網ではないため)。
# S1 単体では D は A と区別できない。D の価値が出るのは S2 (IP-VPN) / S4 (インター
# ネット) / S5 (DX) で、そちらで真価を比較する。
#
# ここでは「D の判断基準」を明示するためだけに書く。

ndl_version: "1.0"

meta:
  name: S1-leased-lines-D
  description: "東京 DC - 大阪 DC 冗長専用線 (候補 D: ハイブリッド。本シナリオでは A と同じ)"
  network_types: [l1-physical]
# [判断基準]
#   service が { dark-fiber, leased-l2, leased-l3 } の場合 = リンク + 属性 (A)
#     理由: 両端が自分の機器で見える。L1Link の対向をそのまま辿れる。
#   service が { ip-vpn, wide-ethernet-multipoint, internet, dx-connection } の場合 = ノード (C)
#     理由: 対向の PE / 相手拠点が L3 で見えない。多地点を 1 つの網で結ぶ。
#
# [書きにくさ] 広域イーサ (S3) は media (L2) に見えて多地点を結ぶため、
#   「L2 専用線 (点対点) ならリンク、広域イーサ (多地点) なら網」と再分割が要る。
#   service の値だけでは分類できない (= 利用者が多地点か点対点かも書く必要がある)。

# 本サンプルは候補 A と同一のため以降省略。
