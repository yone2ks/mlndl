ndl_version: "1.0"

# ============================================================================
# ADR-0026 Pass B3c — invalid: ES の脚が同じ L2VNI の番号の違う VLAN に分かれる
#
#   es-server1 の脚 lag-leaf1-server1 と lag-leaf2-server1 を、それぞれ機器ごとの
#   {lag:} で VLAN 20 と VLAN 21 (別エントリ) に分けて書いている。両方が同じ
#   L2VNI 10020 に載る。
#   相手 (server1) からは 1 本の LAG なのに、脚ごとに別のタグを要求されることになり、
#   実機では動かない (D5 の 2 つ目)。
#
# 期待する検査結果 (ドラフトどおり案 A を実装したら)
#   - error (ADR-0026 D5): 同じ ES の脚が同じ L2VNI の番号の違う VLAN に分かれている
#   - warning (今の ADR-0023 D7): 「ES の脚の一部だけを書いている (ethernet_segment: を促す)」
#     が 2 つの VLAN それぞれに出る。ADR-0026 の error と重ねて出すべきか、それとも
#     error を出すときは warning を抑えるべきかはドラフトに書かれていない (feedback)
#
# 今のコードで動く写し
#   - ADR-0026 の error は実装前なので出ないが、現行の warning が 2 本出る。
# ============================================================================

meta:
  name: adr0026-b3c-invalid-es-legs-different-numbers

layer1:
  nodes:
    - {id: leaf1}
    - {id: leaf2}
    - {id: server1, role: server}
  interfaces:
    - {id: leaf1-swp1,   node: leaf1,   name: swp1}
    - {id: leaf2-swp1,   node: leaf2,   name: swp1}
    - {id: server1-eth0, node: server1, name: eth0}
    - {id: server1-eth1, node: server1, name: eth1}
  links:
    - {id: link-leaf1-server1, endpoints: [leaf1-swp1, server1-eth0], link_speed: 10G, link_role: access}
    - {id: link-leaf2-server1, endpoints: [leaf2-swp1, server1-eth1], link_speed: 10G, link_role: access}
  lag:
    - {id: lag-leaf1-server1, node: leaf1, name: bond1, members: [leaf1-swp1], lacp: {mode: active}}
    - {id: lag-leaf2-server1, node: leaf2, name: bond1, members: [leaf2-swp1], lacp: {mode: active}}
  ethernet_segments:
    - {id: es-server1, members: [{lag: lag-leaf1-server1}, {lag: lag-leaf2-server1}]}

layer2:
  vlans:
    - id: vlan-20
      vlan_id: 20
      trunk_ports:
        - {lag: lag-leaf1-server1}               # ★ ES の脚の片方だけを VLAN 20 に
    - id: vlan-21
      vlan_id: 21
      trunk_ports:
        - {lag: lag-leaf2-server1}               # ★ ES のもう片方を VLAN 21 に
  vteps:
    - {id: vtep-leaf1-leaf2, sources: [leaf1-lo, leaf2-lo], address: 10.0.100.12/32}
  vxlan:
    - id: vni-10020
      type: l2vni
      vni: 10020
      vlans: [vlan-20, vlan-21]                  # ★ 両方とも同じ L2VNI に載る
      vteps: [vtep-leaf1-leaf2]

layer3:
  interfaces:
    - {id: leaf1-lo, node: leaf1, name: lo, ip: 10.0.0.11/32}
    - {id: leaf2-lo, node: leaf2, name: lo, ip: 10.0.0.12/32}
