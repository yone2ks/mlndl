# 書けなかったこと / 書けたが読者が誤読しうること のまとめ (FEEDBACK 全体)
# ----------------------------------------------------------------------------
# (1)  role 推奨語彙に 'bgw' / 'border-gateway' がない -> labels で補う
# (2)  link_role に 'dci' がない -> ADR-0017 の方針に従い自由文字列
# (3)  サイトをまたぐ VLAN エントリが 1 つに統合される (論理的には正しいが読者の感覚に反する)
# (4)  anycast BGW の VIP / MS-VIP を区別する手段が id の慣習しかない
# (5)  ★ L2VNI.vteps が平らなリストなので、段のあるトンネル (intra-site vs inter-site) を書けない
# (6)  L3VNI は vteps を持たないので stitching 時の挙動を書く場所がない
# (7)  VRF.route_targets が 1 組なので、BGW ごとの RT 付け替えを書けない
# (8)  BGW の共有 lo の ip と VTEP.address の関係が読みにくい
# (9)  BGW が ADR-0026 D5 10 の warning 対象になる (正しい構成なのに必ず出る)
# (10) OSPF / BGP のインスタンス = サイトの対応が id の命名規則頼り
# (11) ★ Multi-Site EVPN セッションと使う VTEP の対応が構文に出ない
