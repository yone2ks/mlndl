ndl_version: "1.0"

# ============================================================================
# ADR-0029 Pass C / p1 — EVPN Multi-Site の valid の見本
#
# のちに tests/fixtures/valid_evpn_multisite.yaml になる候補。
#
# 構成 (2 サイト、BGW anycast、DCI 直結):
#   サイト A (east) / サイト B (west) の 2 ファブリック
#     各サイト: spine x2, leaf x2, border-gateway x2 (anycast BGW), server x1
#     server1 は leaf1 / leaf2 の ES (ESI-LAG) で両ホーム (all-active)
#   DCI: 2 本の直結 /31 (a-bgw1<->b-bgw1、a-bgw2<->b-bgw2)
#   L2VNI 10100 (vlan-100、両サイトをまたぐ)、L3VNI 10900 (vrf-tenant-a、Symmetric IRB)
#   leaf の anycast gateway SVI (サイト内 2 leaf・サイト間 4 leaf で同じ IP)
#   underlay: 各サイトで OSPF area 0
#   intra-site overlay: iBGP、spine が RR、leaf / BGW がクライアント
#     (サイト A は AS 65001、サイト B は AS 65002)
#   inter-site overlay (DCI): BGW どうしで eBGP multihop EVPN (lo0 PIP で張る)
#
# anycast BGW のアドレス (NX-OS Multi-Site 風):
#   - lo0 = PIP (機器固有、BGP の update_source)
#   - lo1 = 普通の VIP (サイト内の leaf から見る VTEP、サイト内の 2 BGW で共有)
#   - lo2 = Multi-Site VIP (サイト間 VTEP、サイト内の 2 BGW で共有)
#
# オーバーレイのドメイン (ADR-0029 Pass C):
#   - od-site-a: サイト A の intra-site ファブリック (a-leaf1/2, a-bgw-vip)
#   - od-site-b: サイト B の intra-site ファブリック (b-leaf1/2, b-bgw-vip)
#   - od-dci:    サイト間 (a-bgw-msvip, b-bgw-msvip)
#   BGW は od-site-* と od-dci の両方に VTEP を 1 つずつ持つ (lo1 / lo2 で別)
#
# 前提 (ネットワーク技術上、構成図では省略):
#   - DCI の underlay (eBGP IPv4) で両 BGW の lo0 / lo1 / lo2 を広告する
#     (サイトまたぎのセッションと VTEP の到達性を作るため)
#   - DCI の MTU は MLNDL の対象外。実機ではカプセル化のオーバーヘッドを吸収する
#     ため 1600 以上を推奨 (ADR-0020 で L1 link の mtu はなくした)
#
# default VRF は書かない (ADR-0028 D4)。tenant-a の BGP インスタンスも書く
# (NX-OS で IPv4 unicast 経路を L3VNI の EVPN に流す構成)。
# ============================================================================

meta:
  name: evpn-multisite
  description: 2-site EVPN Multi-Site (anycast BGW, L2VNI + L3VNI Symmetric IRB, DCI direct)
  network_types: [l1-physical, l2-network, l3-unicast]

layer1:
  nodes:
    # ── Site A ───────────────────────────────────────────────────────────
    - {id: a-spine1, name: A-Spine-1, implementation: vm, role: spine,           device_type: cumulus_linux, labels: {site: east}}
    - {id: a-spine2, name: A-Spine-2, implementation: vm, role: spine,           device_type: cumulus_linux, labels: {site: east}}
    - {id: a-leaf1,  name: A-Leaf-1,  implementation: vm, role: leaf,            device_type: cumulus_linux, labels: {site: east}}
    - {id: a-leaf2,  name: A-Leaf-2,  implementation: vm, role: leaf,            device_type: cumulus_linux, labels: {site: east}}
    - {id: a-bgw1,   name: A-BGW-1,   implementation: vm, role: border-gateway,  device_type: nxos,          labels: {site: east}}
    - {id: a-bgw2,   name: A-BGW-2,   implementation: vm, role: border-gateway,  device_type: nxos,          labels: {site: east}}
    - {id: a-server1, name: A-Server-1, implementation: physical, role: server,                              labels: {site: east}}

    # ── Site B ───────────────────────────────────────────────────────────
    - {id: b-spine1, name: B-Spine-1, implementation: vm, role: spine,           device_type: cumulus_linux, labels: {site: west}}
    - {id: b-spine2, name: B-Spine-2, implementation: vm, role: spine,           device_type: cumulus_linux, labels: {site: west}}
    - {id: b-leaf1,  name: B-Leaf-1,  implementation: vm, role: leaf,            device_type: cumulus_linux, labels: {site: west}}
    - {id: b-leaf2,  name: B-Leaf-2,  implementation: vm, role: leaf,            device_type: cumulus_linux, labels: {site: west}}
    - {id: b-bgw1,   name: B-BGW-1,   implementation: vm, role: border-gateway,  device_type: nxos,          labels: {site: west}}
    - {id: b-bgw2,   name: B-BGW-2,   implementation: vm, role: border-gateway,  device_type: nxos,          labels: {site: west}}
    - {id: b-server1, name: B-Server-1, implementation: physical, role: server,                              labels: {site: west}}

  interfaces:
    # ── Site A spines ─────────────────────────────────────────────────────
    - {id: a-spine1-swp1, node: a-spine1, name: swp1}   # -> a-leaf1
    - {id: a-spine1-swp2, node: a-spine1, name: swp2}   # -> a-leaf2
    - {id: a-spine1-swp3, node: a-spine1, name: swp3}   # -> a-bgw1
    - {id: a-spine1-swp4, node: a-spine1, name: swp4}   # -> a-bgw2
    - {id: a-spine2-swp1, node: a-spine2, name: swp1}
    - {id: a-spine2-swp2, node: a-spine2, name: swp2}
    - {id: a-spine2-swp3, node: a-spine2, name: swp3}
    - {id: a-spine2-swp4, node: a-spine2, name: swp4}

    # ── Site A leaves ─────────────────────────────────────────────────────
    - {id: a-leaf1-swp51, node: a-leaf1, name: swp51}   # -> a-spine1
    - {id: a-leaf1-swp52, node: a-leaf1, name: swp52}   # -> a-spine2
    - {id: a-leaf1-swp1,  node: a-leaf1, name: swp1}    # -> a-server1 (ES)
    - {id: a-leaf2-swp51, node: a-leaf2, name: swp51}
    - {id: a-leaf2-swp52, node: a-leaf2, name: swp52}
    - {id: a-leaf2-swp1,  node: a-leaf2, name: swp1}

    # ── Site A BGWs ───────────────────────────────────────────────────────
    - {id: a-bgw1-e1-1, node: a-bgw1, name: Ethernet1/1}   # -> a-spine1
    - {id: a-bgw1-e1-2, node: a-bgw1, name: Ethernet1/2}   # -> a-spine2
    - {id: a-bgw1-e1-3, node: a-bgw1, name: Ethernet1/3}   # DCI -> b-bgw1
    - {id: a-bgw2-e1-1, node: a-bgw2, name: Ethernet1/1}
    - {id: a-bgw2-e1-2, node: a-bgw2, name: Ethernet1/2}
    - {id: a-bgw2-e1-3, node: a-bgw2, name: Ethernet1/3}   # DCI -> b-bgw2

    # ── Site A server ─────────────────────────────────────────────────────
    - {id: a-server1-eth0, node: a-server1, name: eth0}
    - {id: a-server1-eth1, node: a-server1, name: eth1}

    # ── Site B spines ─────────────────────────────────────────────────────
    - {id: b-spine1-swp1, node: b-spine1, name: swp1}
    - {id: b-spine1-swp2, node: b-spine1, name: swp2}
    - {id: b-spine1-swp3, node: b-spine1, name: swp3}
    - {id: b-spine1-swp4, node: b-spine1, name: swp4}
    - {id: b-spine2-swp1, node: b-spine2, name: swp1}
    - {id: b-spine2-swp2, node: b-spine2, name: swp2}
    - {id: b-spine2-swp3, node: b-spine2, name: swp3}
    - {id: b-spine2-swp4, node: b-spine2, name: swp4}

    # ── Site B leaves ─────────────────────────────────────────────────────
    - {id: b-leaf1-swp51, node: b-leaf1, name: swp51}
    - {id: b-leaf1-swp52, node: b-leaf1, name: swp52}
    - {id: b-leaf1-swp1,  node: b-leaf1, name: swp1}
    - {id: b-leaf2-swp51, node: b-leaf2, name: swp51}
    - {id: b-leaf2-swp52, node: b-leaf2, name: swp52}
    - {id: b-leaf2-swp1,  node: b-leaf2, name: swp1}

    # ── Site B BGWs ───────────────────────────────────────────────────────
    - {id: b-bgw1-e1-1, node: b-bgw1, name: Ethernet1/1}
    - {id: b-bgw1-e1-2, node: b-bgw1, name: Ethernet1/2}
    - {id: b-bgw1-e1-3, node: b-bgw1, name: Ethernet1/3}   # DCI -> a-bgw1
    - {id: b-bgw2-e1-1, node: b-bgw2, name: Ethernet1/1}
    - {id: b-bgw2-e1-2, node: b-bgw2, name: Ethernet1/2}
    - {id: b-bgw2-e1-3, node: b-bgw2, name: Ethernet1/3}   # DCI -> a-bgw2

    # ── Site B server ─────────────────────────────────────────────────────
    - {id: b-server1-eth0, node: b-server1, name: eth0}
    - {id: b-server1-eth1, node: b-server1, name: eth1}

  links:
    # ── Site A underlay (spine <-> leaf, spine <-> bgw) ───────────────────
    - {id: link-a-spine1-leaf1, endpoints: [a-spine1-swp1, a-leaf1-swp51], link_speed: 10G, link_role: underlay}
    - {id: link-a-spine1-leaf2, endpoints: [a-spine1-swp2, a-leaf2-swp51], link_speed: 10G, link_role: underlay}
    - {id: link-a-spine1-bgw1,  endpoints: [a-spine1-swp3, a-bgw1-e1-1],   link_speed: 10G, link_role: underlay}
    - {id: link-a-spine1-bgw2,  endpoints: [a-spine1-swp4, a-bgw2-e1-1],   link_speed: 10G, link_role: underlay}
    - {id: link-a-spine2-leaf1, endpoints: [a-spine2-swp1, a-leaf1-swp52], link_speed: 10G, link_role: underlay}
    - {id: link-a-spine2-leaf2, endpoints: [a-spine2-swp2, a-leaf2-swp52], link_speed: 10G, link_role: underlay}
    - {id: link-a-spine2-bgw1,  endpoints: [a-spine2-swp3, a-bgw1-e1-2],   link_speed: 10G, link_role: underlay}
    - {id: link-a-spine2-bgw2,  endpoints: [a-spine2-swp4, a-bgw2-e1-2],   link_speed: 10G, link_role: underlay}

    # ── Site A leaves -> server (ES all-active) ───────────────────────────
    - {id: link-a-leaf1-server1, endpoints: [a-leaf1-swp1, a-server1-eth0], link_speed: 10G, link_role: access}
    - {id: link-a-leaf2-server1, endpoints: [a-leaf2-swp1, a-server1-eth1], link_speed: 10G, link_role: access}

    # ── Site B underlay ───────────────────────────────────────────────────
    - {id: link-b-spine1-leaf1, endpoints: [b-spine1-swp1, b-leaf1-swp51], link_speed: 10G, link_role: underlay}
    - {id: link-b-spine1-leaf2, endpoints: [b-spine1-swp2, b-leaf2-swp51], link_speed: 10G, link_role: underlay}
    - {id: link-b-spine1-bgw1,  endpoints: [b-spine1-swp3, b-bgw1-e1-1],   link_speed: 10G, link_role: underlay}
    - {id: link-b-spine1-bgw2,  endpoints: [b-spine1-swp4, b-bgw2-e1-1],   link_speed: 10G, link_role: underlay}
    - {id: link-b-spine2-leaf1, endpoints: [b-spine2-swp1, b-leaf1-swp52], link_speed: 10G, link_role: underlay}
    - {id: link-b-spine2-leaf2, endpoints: [b-spine2-swp2, b-leaf2-swp52], link_speed: 10G, link_role: underlay}
    - {id: link-b-spine2-bgw1,  endpoints: [b-spine2-swp3, b-bgw1-e1-2],   link_speed: 10G, link_role: underlay}
    - {id: link-b-spine2-bgw2,  endpoints: [b-spine2-swp4, b-bgw2-e1-2],   link_speed: 10G, link_role: underlay}

    # ── Site B leaves -> server ───────────────────────────────────────────
    - {id: link-b-leaf1-server1, endpoints: [b-leaf1-swp1, b-server1-eth0], link_speed: 10G, link_role: access}
    - {id: link-b-leaf2-server1, endpoints: [b-leaf2-swp1, b-server1-eth1], link_speed: 10G, link_role: access}

    # ── DCI (BGW <-> BGW) ────────────────────────────────────────────────
    # link_role: dci は自由文字列 (ADR-0017。推奨プレフィックスは足していない)
    - {id: link-dci-bgw1, endpoints: [a-bgw1-e1-3, b-bgw1-e1-3], link_speed: 10G, link_role: dci}
    - {id: link-dci-bgw2, endpoints: [a-bgw2-e1-3, b-bgw2-e1-3], link_speed: 10G, link_role: dci}

  lags:
    # ES all-active。leaf 側は各機器に 1 ポートだけの bond でも書き出す (ADR-0023)
    - {id: lag-a-leaf1-server1, node: a-leaf1, name: bond1, members: [a-leaf1-swp1], lacp: {mode: active}}
    - {id: lag-a-leaf2-server1, node: a-leaf2, name: bond1, members: [a-leaf2-swp1], lacp: {mode: active}}
    - {id: lag-a-server1-bond0, node: a-server1, name: bond0, members: [a-server1-eth0, a-server1-eth1], lacp: {mode: active}}
    - {id: lag-b-leaf1-server1, node: b-leaf1, name: bond1, members: [b-leaf1-swp1], lacp: {mode: active}}
    - {id: lag-b-leaf2-server1, node: b-leaf2, name: bond1, members: [b-leaf2-swp1], lacp: {mode: active}}
    - {id: lag-b-server1-bond0, node: b-server1, name: bond0, members: [b-server1-eth0, b-server1-eth1], lacp: {mode: active}}

  ethernet_segments:
    - {id: es-a-server1, members: [{lag: lag-a-leaf1-server1}, {lag: lag-a-leaf2-server1}]}
    - {id: es-b-server1, members: [{lag: lag-b-leaf1-server1}, {lag: lag-b-leaf2-server1}]}

layer2:
  vlans:
    # 両サイトで同じ VLAN 番号 (VNI stitching なし)。1 エントリで両サイトの脚
    - id: vlan-100
      vlan_id: 100
      name: tenant-a-webtier
      access_ports:
        - {ethernet_segment: es-a-server1}
        - {ethernet_segment: es-b-server1}

  # ★ ADR-0029 Pass C: オーバーレイのドメイン (= 中でフルメッシュに VXLAN トンネルを張る VTEP の集合)
  # 1 つの VTEP は 1 つのドメイン。DCI も 1 つのドメイン。BGW は 2 つのドメインに VTEP を 1 つずつ持つ。
  overlay_domains:
    - {id: od-site-a, name: Site A fabric, description: Intra-fabric overlay for site east}
    - {id: od-site-b, name: Site B fabric, description: Intra-fabric overlay for site west}
    - {id: od-dci,    name: DCI,           description: Inter-site overlay between BGW anycast MS-VIPs}

  vteps:
    # ── Site A の VTEP ──────────────────────────────────────────────────
    - {id: vtep-a-leaf1,     sources: [a-leaf1-lo],                                            overlay_domain: od-site-a}
    - {id: vtep-a-leaf2,     sources: [a-leaf2-lo],                                            overlay_domain: od-site-a}
    - {id: vtep-a-bgw-vip,   sources: [a-bgw1-lo1, a-bgw2-lo1], address: 10.0.100.1/32,       overlay_domain: od-site-a}
    # ── Site A BGW の DCI 側 VTEP ──────────────────────────────────────
    - {id: vtep-a-bgw-msvip, sources: [a-bgw1-lo2, a-bgw2-lo2], address: 10.0.200.1/32,       overlay_domain: od-dci}
    # ── Site B の VTEP ──────────────────────────────────────────────────
    - {id: vtep-b-leaf1,     sources: [b-leaf1-lo],                                            overlay_domain: od-site-b}
    - {id: vtep-b-leaf2,     sources: [b-leaf2-lo],                                            overlay_domain: od-site-b}
    - {id: vtep-b-bgw-vip,   sources: [b-bgw1-lo1, b-bgw2-lo1], address: 10.0.100.2/32,       overlay_domain: od-site-b}
    - {id: vtep-b-bgw-msvip, sources: [b-bgw1-lo2, b-bgw2-lo2], address: 10.0.200.2/32,       overlay_domain: od-dci}

  vxlans:
    - id: vni-10100
      type: l2vni
      vni: 10100
      vlans: [vlan-100]
      # 参加ドメインは VTEP から導く。トンネルの対は同じ L2VNI で同じドメインの VTEP どうし。
      #   od-site-a 内: {leaf1,leaf2,bgw-vip} の 3 対
      #   od-site-b 内: {leaf1,leaf2,bgw-vip} の 3 対
      #   od-dci    内: {a-bgw-msvip <-> b-bgw-msvip} の 1 対
      # サイト間は BGW が od-site-* と od-dci をまたぐので stitching できる
      vteps:
        - vtep-a-leaf1
        - vtep-a-leaf2
        - vtep-a-bgw-vip
        - vtep-a-bgw-msvip
        - vtep-b-leaf1
        - vtep-b-leaf2
        - vtep-b-bgw-vip
        - vtep-b-bgw-msvip

    - id: vni-10900
      type: l3vni
      vni: 10900
      vrf: vrf-tenant-a
      irb_mode: symmetric

layer3:
  vrfs:
    # default VRF は書かない (ADR-0028 D4)。tenant-a だけ定義
    - id: vrf-tenant-a
      rd: "65001:100"
      l3vni: vni-10900
      route_targets:
        import: ["65001:100", "65002:100"]
        export: ["65001:100"]

  interfaces:
    # ── ループバック ─────────────────────────────────────────────────────
    - {id: a-spine1-lo, node: a-spine1, name: lo, ip: 10.0.0.1/32}
    - {id: a-spine2-lo, node: a-spine2, name: lo, ip: 10.0.0.2/32}
    - {id: a-leaf1-lo,  node: a-leaf1,  name: lo, ip: 10.0.0.11/32}
    - {id: a-leaf2-lo,  node: a-leaf2,  name: lo, ip: 10.0.0.12/32}
    # BGW の 3 本のループバック。lo0 = PIP、lo1 = 普通の VIP、lo2 = Multi-Site VIP
    - {id: a-bgw1-lo,   node: a-bgw1,   name: loopback0, ip: 10.0.0.21/32}
    - {id: a-bgw1-lo1,  node: a-bgw1,   name: loopback1, ip: 10.0.100.1/32}
    - {id: a-bgw1-lo2,  node: a-bgw1,   name: loopback2, ip: 10.0.200.1/32}
    - {id: a-bgw2-lo,   node: a-bgw2,   name: loopback0, ip: 10.0.0.22/32}
    - {id: a-bgw2-lo1,  node: a-bgw2,   name: loopback1, ip: 10.0.100.1/32}
    - {id: a-bgw2-lo2,  node: a-bgw2,   name: loopback2, ip: 10.0.200.1/32}

    - {id: b-spine1-lo, node: b-spine1, name: lo, ip: 10.0.1.1/32}
    - {id: b-spine2-lo, node: b-spine2, name: lo, ip: 10.0.1.2/32}
    - {id: b-leaf1-lo,  node: b-leaf1,  name: lo, ip: 10.0.1.11/32}
    - {id: b-leaf2-lo,  node: b-leaf2,  name: lo, ip: 10.0.1.12/32}
    - {id: b-bgw1-lo,   node: b-bgw1,   name: loopback0, ip: 10.0.1.21/32}
    - {id: b-bgw1-lo1,  node: b-bgw1,   name: loopback1, ip: 10.0.100.2/32}
    - {id: b-bgw1-lo2,  node: b-bgw1,   name: loopback2, ip: 10.0.200.2/32}
    - {id: b-bgw2-lo,   node: b-bgw2,   name: loopback0, ip: 10.0.1.22/32}
    - {id: b-bgw2-lo1,  node: b-bgw2,   name: loopback1, ip: 10.0.100.2/32}
    - {id: b-bgw2-lo2,  node: b-bgw2,   name: loopback2, ip: 10.0.200.2/32}

    # ── Site A underlay P2P (/31) ─────────────────────────────────────────
    - {id: a-spine1-swp1-l3, node: a-spine1, name: swp1, ip: 10.1.0.0/31, attaches_to: {interface: a-spine1-swp1}}
    - {id: a-leaf1-swp51-l3, node: a-leaf1,  name: swp51, ip: 10.1.0.1/31, attaches_to: {interface: a-leaf1-swp51}}
    - {id: a-spine1-swp2-l3, node: a-spine1, name: swp2, ip: 10.1.0.2/31, attaches_to: {interface: a-spine1-swp2}}
    - {id: a-leaf2-swp51-l3, node: a-leaf2,  name: swp51, ip: 10.1.0.3/31, attaches_to: {interface: a-leaf2-swp51}}
    - {id: a-spine1-swp3-l3, node: a-spine1, name: swp3, ip: 10.1.0.4/31, attaches_to: {interface: a-spine1-swp3}}
    - {id: a-bgw1-e1-1-l3,   node: a-bgw1,   name: Ethernet1/1, ip: 10.1.0.5/31, attaches_to: {interface: a-bgw1-e1-1}}
    - {id: a-spine1-swp4-l3, node: a-spine1, name: swp4, ip: 10.1.0.6/31, attaches_to: {interface: a-spine1-swp4}}
    - {id: a-bgw2-e1-1-l3,   node: a-bgw2,   name: Ethernet1/1, ip: 10.1.0.7/31, attaches_to: {interface: a-bgw2-e1-1}}
    - {id: a-spine2-swp1-l3, node: a-spine2, name: swp1, ip: 10.1.0.8/31, attaches_to: {interface: a-spine2-swp1}}
    - {id: a-leaf1-swp52-l3, node: a-leaf1,  name: swp52, ip: 10.1.0.9/31, attaches_to: {interface: a-leaf1-swp52}}
    - {id: a-spine2-swp2-l3, node: a-spine2, name: swp2, ip: 10.1.0.10/31, attaches_to: {interface: a-spine2-swp2}}
    - {id: a-leaf2-swp52-l3, node: a-leaf2,  name: swp52, ip: 10.1.0.11/31, attaches_to: {interface: a-leaf2-swp52}}
    - {id: a-spine2-swp3-l3, node: a-spine2, name: swp3, ip: 10.1.0.12/31, attaches_to: {interface: a-spine2-swp3}}
    - {id: a-bgw1-e1-2-l3,   node: a-bgw1,   name: Ethernet1/2, ip: 10.1.0.13/31, attaches_to: {interface: a-bgw1-e1-2}}
    - {id: a-spine2-swp4-l3, node: a-spine2, name: swp4, ip: 10.1.0.14/31, attaches_to: {interface: a-spine2-swp4}}
    - {id: a-bgw2-e1-2-l3,   node: a-bgw2,   name: Ethernet1/2, ip: 10.1.0.15/31, attaches_to: {interface: a-bgw2-e1-2}}

    # ── Site B underlay P2P ──────────────────────────────────────────────
    - {id: b-spine1-swp1-l3, node: b-spine1, name: swp1, ip: 10.2.0.0/31, attaches_to: {interface: b-spine1-swp1}}
    - {id: b-leaf1-swp51-l3, node: b-leaf1,  name: swp51, ip: 10.2.0.1/31, attaches_to: {interface: b-leaf1-swp51}}
    - {id: b-spine1-swp2-l3, node: b-spine1, name: swp2, ip: 10.2.0.2/31, attaches_to: {interface: b-spine1-swp2}}
    - {id: b-leaf2-swp51-l3, node: b-leaf2,  name: swp51, ip: 10.2.0.3/31, attaches_to: {interface: b-leaf2-swp51}}
    - {id: b-spine1-swp3-l3, node: b-spine1, name: swp3, ip: 10.2.0.4/31, attaches_to: {interface: b-spine1-swp3}}
    - {id: b-bgw1-e1-1-l3,   node: b-bgw1,   name: Ethernet1/1, ip: 10.2.0.5/31, attaches_to: {interface: b-bgw1-e1-1}}
    - {id: b-spine1-swp4-l3, node: b-spine1, name: swp4, ip: 10.2.0.6/31, attaches_to: {interface: b-spine1-swp4}}
    - {id: b-bgw2-e1-1-l3,   node: b-bgw2,   name: Ethernet1/1, ip: 10.2.0.7/31, attaches_to: {interface: b-bgw2-e1-1}}
    - {id: b-spine2-swp1-l3, node: b-spine2, name: swp1, ip: 10.2.0.8/31, attaches_to: {interface: b-spine2-swp1}}
    - {id: b-leaf1-swp52-l3, node: b-leaf1,  name: swp52, ip: 10.2.0.9/31, attaches_to: {interface: b-leaf1-swp52}}
    - {id: b-spine2-swp2-l3, node: b-spine2, name: swp2, ip: 10.2.0.10/31, attaches_to: {interface: b-spine2-swp2}}
    - {id: b-leaf2-swp52-l3, node: b-leaf2,  name: swp52, ip: 10.2.0.11/31, attaches_to: {interface: b-leaf2-swp52}}
    - {id: b-spine2-swp3-l3, node: b-spine2, name: swp3, ip: 10.2.0.12/31, attaches_to: {interface: b-spine2-swp3}}
    - {id: b-bgw1-e1-2-l3,   node: b-bgw1,   name: Ethernet1/2, ip: 10.2.0.13/31, attaches_to: {interface: b-bgw1-e1-2}}
    - {id: b-spine2-swp4-l3, node: b-spine2, name: swp4, ip: 10.2.0.14/31, attaches_to: {interface: b-spine2-swp4}}
    - {id: b-bgw2-e1-2-l3,   node: b-bgw2,   name: Ethernet1/2, ip: 10.2.0.15/31, attaches_to: {interface: b-bgw2-e1-2}}

    # ── DCI P2P (eBGP underlay) ──────────────────────────────────────────
    - {id: a-bgw1-e1-3-l3, node: a-bgw1, name: Ethernet1/3, ip: 10.3.0.0/31, attaches_to: {interface: a-bgw1-e1-3}}
    - {id: b-bgw1-e1-3-l3, node: b-bgw1, name: Ethernet1/3, ip: 10.3.0.1/31, attaches_to: {interface: b-bgw1-e1-3}}
    - {id: a-bgw2-e1-3-l3, node: a-bgw2, name: Ethernet1/3, ip: 10.3.0.2/31, attaches_to: {interface: a-bgw2-e1-3}}
    - {id: b-bgw2-e1-3-l3, node: b-bgw2, name: Ethernet1/3, ip: 10.3.0.3/31, attaches_to: {interface: b-bgw2-e1-3}}

    # ── SVI (anycast GW on leaves in both sites) ──────────────────────────
    # 両サイトで同じ VNI・同じ VLAN・同じ anycast GW アドレス。D6 の一致検査は L2VNI 単位
    - {id: a-leaf1-vlan-100, node: a-leaf1, name: Vlan100, attaches_to: {vlan: vlan-100}, ip: 192.168.100.1/24, vrf: vrf-tenant-a, gateway_redundancy: [{mode: anycast_gateway}]}
    - {id: a-leaf2-vlan-100, node: a-leaf2, name: Vlan100, attaches_to: {vlan: vlan-100}, ip: 192.168.100.1/24, vrf: vrf-tenant-a, gateway_redundancy: [{mode: anycast_gateway}]}
    - {id: b-leaf1-vlan-100, node: b-leaf1, name: Vlan100, attaches_to: {vlan: vlan-100}, ip: 192.168.100.1/24, vrf: vrf-tenant-a, gateway_redundancy: [{mode: anycast_gateway}]}
    - {id: b-leaf2-vlan-100, node: b-leaf2, name: Vlan100, attaches_to: {vlan: vlan-100}, ip: 192.168.100.1/24, vrf: vrf-tenant-a, gateway_redundancy: [{mode: anycast_gateway}]}

    # ── サーバー (bond0 に IP、GW は leaf の anycast GW 192.168.100.1) ───
    - {id: a-server1-bond0-l3, node: a-server1, name: bond0, ip: 192.168.100.10/24, attaches_to: {lag: lag-a-server1-bond0}}
    - {id: b-server1-bond0-l3, node: b-server1, name: bond0, ip: 192.168.100.20/24, attaches_to: {lag: lag-b-server1-bond0}}

control_plane:
  bgp:
    # default VRF の BGP (underlay / overlay 両方)。vrf 省略 = default VRF (ADR-0028 D4)
    - id: bgp-default
      nodes:
        # Site A: AS 65001 (iBGP で揃える)
        - {node: a-spine1, local_as: 65001}
        - {node: a-spine2, local_as: 65001}
        - {node: a-leaf1,  local_as: 65001}
        - {node: a-leaf2,  local_as: 65001}
        - {node: a-bgw1,   local_as: 65001}
        - {node: a-bgw2,   local_as: 65001}
        # Site B: AS 65002
        - {node: b-spine1, local_as: 65002}
        - {node: b-spine2, local_as: 65002}
        - {node: b-leaf1,  local_as: 65002}
        - {node: b-leaf2,  local_as: 65002}
        - {node: b-bgw1,   local_as: 65002}
        - {node: b-bgw2,   local_as: 65002}

    # テナント VRF の BGP インスタンス (BGW が IPv4 unicast を L3VNI の EVPN に乗せる)
    - id: bgp-tenant-a
      vrf: vrf-tenant-a
      nodes:
        - {node: a-bgw1, local_as: 65001}
        - {node: a-bgw2, local_as: 65001}
        - {node: b-bgw1, local_as: 65002}
        - {node: b-bgw2, local_as: 65002}

  ospf:
    - id: ospf-site-a
      nodes: [{node: a-spine1}, {node: a-spine2}, {node: a-leaf1}, {node: a-leaf2}, {node: a-bgw1}, {node: a-bgw2}]
    - id: ospf-site-b
      nodes: [{node: b-spine1}, {node: b-spine2}, {node: b-leaf1}, {node: b-leaf2}, {node: b-bgw1}, {node: b-bgw2}]

  routing_neighbors:
    # ── サイト A underlay (OSPF area 0) ────────────────────────────────
    - {id: ospf-adj-a-spine1-leaf1, type: ospf, instance: ospf-site-a, from: {node: a-spine1, interface: a-spine1-swp1-l3}, to: {node: a-leaf1, interface: a-leaf1-swp51-l3}, area: "0.0.0.0"}
    - {id: ospf-adj-a-spine1-leaf2, type: ospf, instance: ospf-site-a, from: {node: a-spine1, interface: a-spine1-swp2-l3}, to: {node: a-leaf2, interface: a-leaf2-swp51-l3}, area: "0.0.0.0"}
    - {id: ospf-adj-a-spine1-bgw1,  type: ospf, instance: ospf-site-a, from: {node: a-spine1, interface: a-spine1-swp3-l3}, to: {node: a-bgw1,  interface: a-bgw1-e1-1-l3},  area: "0.0.0.0"}
    - {id: ospf-adj-a-spine1-bgw2,  type: ospf, instance: ospf-site-a, from: {node: a-spine1, interface: a-spine1-swp4-l3}, to: {node: a-bgw2,  interface: a-bgw2-e1-1-l3},  area: "0.0.0.0"}
    - {id: ospf-adj-a-spine2-leaf1, type: ospf, instance: ospf-site-a, from: {node: a-spine2, interface: a-spine2-swp1-l3}, to: {node: a-leaf1, interface: a-leaf1-swp52-l3}, area: "0.0.0.0"}
    - {id: ospf-adj-a-spine2-leaf2, type: ospf, instance: ospf-site-a, from: {node: a-spine2, interface: a-spine2-swp2-l3}, to: {node: a-leaf2, interface: a-leaf2-swp52-l3}, area: "0.0.0.0"}
    - {id: ospf-adj-a-spine2-bgw1,  type: ospf, instance: ospf-site-a, from: {node: a-spine2, interface: a-spine2-swp3-l3}, to: {node: a-bgw1,  interface: a-bgw1-e1-2-l3},  area: "0.0.0.0"}
    - {id: ospf-adj-a-spine2-bgw2,  type: ospf, instance: ospf-site-a, from: {node: a-spine2, interface: a-spine2-swp4-l3}, to: {node: a-bgw2,  interface: a-bgw2-e1-2-l3},  area: "0.0.0.0"}

    # ── サイト A overlay (iBGP EVPN、spine = RR) ──────────────────────────
    - {id: bgp-peer-a-spine1-leaf1-evpn, type: bgp, instance: bgp-default, from: {node: a-spine1, update_source: a-spine1-lo}, to: {node: a-leaf1, update_source: a-leaf1-lo, route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-a-spine1-leaf2-evpn, type: bgp, instance: bgp-default, from: {node: a-spine1, update_source: a-spine1-lo}, to: {node: a-leaf2, update_source: a-leaf2-lo, route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-a-spine1-bgw1-evpn,  type: bgp, instance: bgp-default, from: {node: a-spine1, update_source: a-spine1-lo}, to: {node: a-bgw1,  update_source: a-bgw1-lo,  route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-a-spine1-bgw2-evpn,  type: bgp, instance: bgp-default, from: {node: a-spine1, update_source: a-spine1-lo}, to: {node: a-bgw2,  update_source: a-bgw2-lo,  route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-a-spine2-leaf1-evpn, type: bgp, instance: bgp-default, from: {node: a-spine2, update_source: a-spine2-lo}, to: {node: a-leaf1, update_source: a-leaf1-lo, route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-a-spine2-leaf2-evpn, type: bgp, instance: bgp-default, from: {node: a-spine2, update_source: a-spine2-lo}, to: {node: a-leaf2, update_source: a-leaf2-lo, route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-a-spine2-bgw1-evpn,  type: bgp, instance: bgp-default, from: {node: a-spine2, update_source: a-spine2-lo}, to: {node: a-bgw1,  update_source: a-bgw1-lo,  route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-a-spine2-bgw2-evpn,  type: bgp, instance: bgp-default, from: {node: a-spine2, update_source: a-spine2-lo}, to: {node: a-bgw2,  update_source: a-bgw2-lo,  route_reflector_client: true}, address_families: [l2vpn_evpn]}

    # ── サイト B underlay (OSPF area 0) ────────────────────────────────
    - {id: ospf-adj-b-spine1-leaf1, type: ospf, instance: ospf-site-b, from: {node: b-spine1, interface: b-spine1-swp1-l3}, to: {node: b-leaf1, interface: b-leaf1-swp51-l3}, area: "0.0.0.0"}
    - {id: ospf-adj-b-spine1-leaf2, type: ospf, instance: ospf-site-b, from: {node: b-spine1, interface: b-spine1-swp2-l3}, to: {node: b-leaf2, interface: b-leaf2-swp51-l3}, area: "0.0.0.0"}
    - {id: ospf-adj-b-spine1-bgw1,  type: ospf, instance: ospf-site-b, from: {node: b-spine1, interface: b-spine1-swp3-l3}, to: {node: b-bgw1,  interface: b-bgw1-e1-1-l3},  area: "0.0.0.0"}
    - {id: ospf-adj-b-spine1-bgw2,  type: ospf, instance: ospf-site-b, from: {node: b-spine1, interface: b-spine1-swp4-l3}, to: {node: b-bgw2,  interface: b-bgw2-e1-1-l3},  area: "0.0.0.0"}
    - {id: ospf-adj-b-spine2-leaf1, type: ospf, instance: ospf-site-b, from: {node: b-spine2, interface: b-spine2-swp1-l3}, to: {node: b-leaf1, interface: b-leaf1-swp52-l3}, area: "0.0.0.0"}
    - {id: ospf-adj-b-spine2-leaf2, type: ospf, instance: ospf-site-b, from: {node: b-spine2, interface: b-spine2-swp2-l3}, to: {node: b-leaf2, interface: b-leaf2-swp52-l3}, area: "0.0.0.0"}
    - {id: ospf-adj-b-spine2-bgw1,  type: ospf, instance: ospf-site-b, from: {node: b-spine2, interface: b-spine2-swp3-l3}, to: {node: b-bgw1,  interface: b-bgw1-e1-2-l3},  area: "0.0.0.0"}
    - {id: ospf-adj-b-spine2-bgw2,  type: ospf, instance: ospf-site-b, from: {node: b-spine2, interface: b-spine2-swp4-l3}, to: {node: b-bgw2,  interface: b-bgw2-e1-2-l3},  area: "0.0.0.0"}

    # ── サイト B overlay (iBGP EVPN、spine = RR) ──────────────────────────
    - {id: bgp-peer-b-spine1-leaf1-evpn, type: bgp, instance: bgp-default, from: {node: b-spine1, update_source: b-spine1-lo}, to: {node: b-leaf1, update_source: b-leaf1-lo, route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-b-spine1-leaf2-evpn, type: bgp, instance: bgp-default, from: {node: b-spine1, update_source: b-spine1-lo}, to: {node: b-leaf2, update_source: b-leaf2-lo, route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-b-spine1-bgw1-evpn,  type: bgp, instance: bgp-default, from: {node: b-spine1, update_source: b-spine1-lo}, to: {node: b-bgw1,  update_source: b-bgw1-lo,  route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-b-spine1-bgw2-evpn,  type: bgp, instance: bgp-default, from: {node: b-spine1, update_source: b-spine1-lo}, to: {node: b-bgw2,  update_source: b-bgw2-lo,  route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-b-spine2-leaf1-evpn, type: bgp, instance: bgp-default, from: {node: b-spine2, update_source: b-spine2-lo}, to: {node: b-leaf1, update_source: b-leaf1-lo, route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-b-spine2-leaf2-evpn, type: bgp, instance: bgp-default, from: {node: b-spine2, update_source: b-spine2-lo}, to: {node: b-leaf2, update_source: b-leaf2-lo, route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-b-spine2-bgw1-evpn,  type: bgp, instance: bgp-default, from: {node: b-spine2, update_source: b-spine2-lo}, to: {node: b-bgw1,  update_source: b-bgw1-lo,  route_reflector_client: true}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-b-spine2-bgw2-evpn,  type: bgp, instance: bgp-default, from: {node: b-spine2, update_source: b-spine2-lo}, to: {node: b-bgw2,  update_source: b-bgw2-lo,  route_reflector_client: true}, address_families: [l2vpn_evpn]}

    # ── DCI underlay (eBGP IPv4 直結、BGW の lo0 / lo1 / lo2 を広告する) ──
    - {id: bgp-peer-a-bgw1-b-bgw1, type: bgp, instance: bgp-default, from: {node: a-bgw1, update_source: a-bgw1-e1-3-l3}, to: {node: b-bgw1, update_source: b-bgw1-e1-3-l3}, address_families: [ipv4_unicast]}
    - {id: bgp-peer-a-bgw2-b-bgw2, type: bgp, instance: bgp-default, from: {node: a-bgw2, update_source: a-bgw2-e1-3-l3}, to: {node: b-bgw2, update_source: b-bgw2-e1-3-l3}, address_families: [ipv4_unicast]}

    # ── DCI overlay (Multi-Site eBGP multihop EVPN、BGW の lo0 PIP で張る) ─
    - {id: bgp-peer-a-bgw1-b-bgw1-evpn, type: bgp, instance: bgp-default, from: {node: a-bgw1, update_source: a-bgw1-lo}, to: {node: b-bgw1, update_source: b-bgw1-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-a-bgw2-b-bgw2-evpn, type: bgp, instance: bgp-default, from: {node: a-bgw2, update_source: a-bgw2-lo}, to: {node: b-bgw2, update_source: b-bgw2-lo}, address_families: [l2vpn_evpn]}
