ndl_version: "1.0"

# ============================================================================
# ADR-0029 Pass C / p3 — overlay_domains を書かない構成 (今までと同じ)
#
# 期待する結果: valid (新検査を入れても、ドメインを書かない今の fixture は
#              そのまま通る。加算的な変更)
#
# 構成: 1 サイトの最小の Spine-Leaf。2 spine + 2 leaf + 1 server。
#       L2VNI 10100 (vlan-100) に 2 leaf の VTEP が入る。
#
# 意味:
#   - overlay_domains を書かず、VTEP に overlay_domain も書かない
#   - 「全 VTEP が 1 つの暗黙のドメインに属する」= 従来どおりフルメッシュ
#   - Pass B の「ドメインは任意。書かないと 1 つの暗黙のドメイン」(summary 3) の確認
#
# tests/fixtures/valid_full_dc.yaml と valid_l2vni.yaml は、このファイルと同じ
# 意味合いで overlay_domains を書かずに済む。ADR-0027 の加算的な変更の約束どおり。
# ============================================================================

meta:
  name: p3-no-domain
  description: Single-site Spine-Leaf without overlay_domains (= 1 implicit domain)
  network_types: [l1-physical, l2-network, l3-unicast]

layer1:
  nodes:
    - {id: spine1, implementation: vm, role: spine,  device_type: cumulus_linux}
    - {id: spine2, implementation: vm, role: spine,  device_type: cumulus_linux}
    - {id: leaf1,  implementation: vm, role: leaf,   device_type: cumulus_linux}
    - {id: leaf2,  implementation: vm, role: leaf,   device_type: cumulus_linux}
    - {id: server1, implementation: physical, role: server}

  interfaces:
    - {id: spine1-swp1, node: spine1, name: swp1}
    - {id: spine1-swp2, node: spine1, name: swp2}
    - {id: spine2-swp1, node: spine2, name: swp1}
    - {id: spine2-swp2, node: spine2, name: swp2}
    - {id: leaf1-swp51, node: leaf1,  name: swp51}
    - {id: leaf1-swp52, node: leaf1,  name: swp52}
    - {id: leaf1-swp1,  node: leaf1,  name: swp1}
    - {id: leaf2-swp51, node: leaf2,  name: swp51}
    - {id: leaf2-swp52, node: leaf2,  name: swp52}
    - {id: server1-eth0, node: server1, name: eth0}

  links:
    - {id: link-spine1-leaf1, endpoints: [spine1-swp1, leaf1-swp51], link_speed: 10G, link_role: underlay}
    - {id: link-spine1-leaf2, endpoints: [spine1-swp2, leaf2-swp51], link_speed: 10G, link_role: underlay}
    - {id: link-spine2-leaf1, endpoints: [spine2-swp1, leaf1-swp52], link_speed: 10G, link_role: underlay}
    - {id: link-spine2-leaf2, endpoints: [spine2-swp2, leaf2-swp52], link_speed: 10G, link_role: underlay}
    - {id: link-leaf1-server1, endpoints: [leaf1-swp1, server1-eth0], link_speed: 10G, link_role: access}

layer2:
  # ★ overlay_domains を書かない。全 VTEP が暗黙の 1 ドメイン
  vlans:
    - {id: vlan-100, vlan_id: 100, name: tenant-a, access_ports: [{interface: leaf1-swp1}]}

  vteps:
    # ★ VTEP に overlay_domain も書かない
    - {id: vtep-leaf1, sources: [leaf1-lo]}
    - {id: vtep-leaf2, sources: [leaf2-lo]}

  vxlans:
    - id: vni-10100
      type: l2vni
      vni: 10100
      vlans: [vlan-100]
      vteps: [vtep-leaf1, vtep-leaf2]   # 2 VTEP で 1 対のトンネル (フルメッシュ)

layer3:
  interfaces:
    - {id: spine1-lo, node: spine1, name: lo, ip: 10.0.0.1/32}
    - {id: spine2-lo, node: spine2, name: lo, ip: 10.0.0.2/32}
    - {id: leaf1-lo,  node: leaf1,  name: lo, ip: 10.0.0.11/32}
    - {id: leaf2-lo,  node: leaf2,  name: lo, ip: 10.0.0.12/32}

    - {id: spine1-swp1-l3, node: spine1, name: swp1, ip: 10.1.0.0/31, attaches_to: {interface: spine1-swp1}}
    - {id: leaf1-swp51-l3, node: leaf1,  name: swp51, ip: 10.1.0.1/31, attaches_to: {interface: leaf1-swp51}}
    - {id: spine1-swp2-l3, node: spine1, name: swp2, ip: 10.1.0.2/31, attaches_to: {interface: spine1-swp2}}
    - {id: leaf2-swp51-l3, node: leaf2,  name: swp51, ip: 10.1.0.3/31, attaches_to: {interface: leaf2-swp51}}
    - {id: spine2-swp1-l3, node: spine2, name: swp1, ip: 10.1.0.4/31, attaches_to: {interface: spine2-swp1}}
    - {id: leaf1-swp52-l3, node: leaf1,  name: swp52, ip: 10.1.0.5/31, attaches_to: {interface: leaf1-swp52}}
    - {id: spine2-swp2-l3, node: spine2, name: swp2, ip: 10.1.0.6/31, attaches_to: {interface: spine2-swp2}}
    - {id: leaf2-swp52-l3, node: leaf2,  name: swp52, ip: 10.1.0.7/31, attaches_to: {interface: leaf2-swp52}}

    - {id: leaf1-vlan-100, node: leaf1, name: Vlan100, attaches_to: {vlan: vlan-100}, ip: 192.168.100.1/24, gateway_redundancy: [{mode: anycast_gateway}]}
    - {id: leaf2-vlan-100, node: leaf2, name: Vlan100, attaches_to: {vlan: vlan-100}, ip: 192.168.100.1/24, gateway_redundancy: [{mode: anycast_gateway}]}

    - {id: server1-eth0-l3, node: server1, name: eth0, ip: 192.168.100.10/24, attaches_to: {interface: server1-eth0}}

control_plane:
  bgp:
    - id: bgp-default
      nodes:
        - {node: spine1, local_as: 65000}
        - {node: spine2, local_as: 65000}
        - {node: leaf1,  local_as: 65001}
        - {node: leaf2,  local_as: 65002}

  routing_neighbors:
    - {id: bgp-peer-spine1-leaf1, type: bgp, from: {node: spine1, update_source: spine1-swp1-l3}, to: {node: leaf1, update_source: leaf1-swp51-l3}, address_families: [ipv4_unicast]}
    - {id: bgp-peer-spine1-leaf2, type: bgp, from: {node: spine1, update_source: spine1-swp2-l3}, to: {node: leaf2, update_source: leaf2-swp51-l3}, address_families: [ipv4_unicast]}
    - {id: bgp-peer-spine2-leaf1, type: bgp, from: {node: spine2, update_source: spine2-swp1-l3}, to: {node: leaf1, update_source: leaf1-swp52-l3}, address_families: [ipv4_unicast]}
    - {id: bgp-peer-spine2-leaf2, type: bgp, from: {node: spine2, update_source: spine2-swp2-l3}, to: {node: leaf2, update_source: leaf2-swp52-l3}, address_families: [ipv4_unicast]}

    - {id: bgp-peer-spine1-leaf1-evpn, type: bgp, from: {node: spine1, update_source: spine1-lo}, to: {node: leaf1, update_source: leaf1-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine1-leaf2-evpn, type: bgp, from: {node: spine1, update_source: spine1-lo}, to: {node: leaf2, update_source: leaf2-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine2-leaf1-evpn, type: bgp, from: {node: spine2, update_source: spine2-lo}, to: {node: leaf1, update_source: leaf1-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine2-leaf2-evpn, type: bgp, from: {node: spine2, update_source: spine2-lo}, to: {node: leaf2, update_source: leaf2-lo}, address_families: [l2vpn_evpn]}
