ndl_version: "1.0"

# ============================================================================
# 案A: 現状スキーマ (layer3.routing_adjacencies + protocols.bgp が併存)
# トポロジー: Spine2 / Leaf2 / eBGP underlay + iBGP EVPN overlay + BFD
#
# 二重表現の実測:
#   - Spine1-Leaf1 は routing_adjacencies の bgp-peer-spine1-leaf1 と
#     protocols.bgp[bgp-underlay] の spine1→leaf1 neighbor で 2 か所に登場
#   - overlay も同様: routing_adjacencies の bgp-peer-...-evpn と
#     protocols.bgp[bgp-evpn] の RR 定義で 2 か所
#
# 静的トレース: すべての参照は解決可能。error なしを予測。
#   ID prefix は全て規約準拠 (bgp-peer- / bfd-) なので warning も 0 想定。
# ============================================================================

meta:
  name: r2a-current-layout
  network_types: [l1-physical, l2-network, l3-unicast]

layer1:
  nodes:
    - { id: spine1, implementation: vm, role: spine, device_type: cumulus_linux }
    - { id: spine2, implementation: vm, role: spine, device_type: cumulus_linux }
    - { id: leaf1,  implementation: vm, role: leaf,  device_type: cumulus_linux }
    - { id: leaf2,  implementation: vm, role: leaf,  device_type: cumulus_linux }
  interfaces:
    - { id: spine1-swp1, node: spine1, name: swp1 }
    - { id: spine1-swp2, node: spine1, name: swp2 }
    - { id: spine2-swp1, node: spine2, name: swp1 }
    - { id: spine2-swp2, node: spine2, name: swp2 }
    - { id: leaf1-swp51, node: leaf1, name: swp51 }
    - { id: leaf1-swp52, node: leaf1, name: swp52 }
    - { id: leaf2-swp51, node: leaf2, name: swp51 }
    - { id: leaf2-swp52, node: leaf2, name: swp52 }
  links:
    - { id: link-spine1-leaf1, endpoints: [spine1-swp1, leaf1-swp51], mtu: 9216, link_role: underlay }
    - { id: link-spine1-leaf2, endpoints: [spine1-swp2, leaf2-swp51], mtu: 9216, link_role: underlay }
    - { id: link-spine2-leaf1, endpoints: [spine2-swp1, leaf1-swp52], mtu: 9216, link_role: underlay }
    - { id: link-spine2-leaf2, endpoints: [spine2-swp2, leaf2-swp52], mtu: 9216, link_role: underlay }

layer3:
  vrfs:
    - id: vrf-default
  interfaces:
    - { id: spine1-lo, node: spine1, interface: lo, ip: 10.0.0.1/32 }
    - { id: spine2-lo, node: spine2, interface: lo, ip: 10.0.0.2/32 }
    - { id: leaf1-lo,  node: leaf1,  interface: lo, ip: 10.0.0.11/32 }
    - { id: leaf2-lo,  node: leaf2,  interface: lo, ip: 10.0.0.12/32 }
    - { id: leaf1-swp51-l3, node: leaf1, interface: swp51, ip: 10.1.0.1/31, vrf: vrf-default, attaches_to: {interface: leaf1-swp51} }
    - { id: leaf2-swp51-l3, node: leaf2, interface: swp51, ip: 10.1.0.3/31, vrf: vrf-default, attaches_to: {interface: leaf2-swp51} }
    - { id: leaf1-swp52-l3, node: leaf1, interface: swp52, ip: 10.1.0.5/31, vrf: vrf-default, attaches_to: {interface: leaf1-swp52} }
    - { id: leaf2-swp52-l3, node: leaf2, interface: swp52, ip: 10.1.0.7/31, vrf: vrf-default, attaches_to: {interface: leaf2-swp52} }

  # --- 隣接: 「誰と誰が話す」+ 使う物理リンク ------------------------------
  routing_adjacencies:
    - { id: bgp-peer-spine1-leaf1, type: bgp, from: {node: spine1, update_source: spine1-lo}, to: {node: leaf1, update_source: leaf1-lo}, attaches_to: {link: link-spine1-leaf1} }
    - { id: bgp-peer-spine1-leaf2, type: bgp, from: {node: spine1, update_source: spine1-lo}, to: {node: leaf2, update_source: leaf2-lo}, attaches_to: {link: link-spine1-leaf2} }
    - { id: bgp-peer-spine2-leaf1, type: bgp, from: {node: spine2, update_source: spine2-lo}, to: {node: leaf1, update_source: leaf1-lo}, attaches_to: {link: link-spine2-leaf1} }
    - { id: bgp-peer-spine2-leaf2, type: bgp, from: {node: spine2, update_source: spine2-lo}, to: {node: leaf2, update_source: leaf2-lo}, attaches_to: {link: link-spine2-leaf2} }
    # overlay iBGP EVPN セッションは loopback-to-loopback。物理リンク 1 本には対応しない → attaches_to 省略
    - { id: bgp-peer-spine1-leaf1-evpn, type: bgp, from: {node: spine1, update_source: spine1-lo}, to: {node: leaf1, update_source: leaf1-lo} }
    - { id: bgp-peer-spine1-leaf2-evpn, type: bgp, from: {node: spine1, update_source: spine1-lo}, to: {node: leaf2, update_source: leaf2-lo} }
    - { id: bgp-peer-spine2-leaf1-evpn, type: bgp, from: {node: spine2, update_source: spine2-lo}, to: {node: leaf1, update_source: leaf1-lo} }
    - { id: bgp-peer-spine2-leaf2-evpn, type: bgp, from: {node: spine2, update_source: spine2-lo}, to: {node: leaf2, update_source: leaf2-lo} }

protocols:
  bfd:
    - { id: bfd-global, min_tx: 300, min_rx: 300, multiplier: 3, nodes: [spine1, spine2, leaf1, leaf2] }
  bgp:
    - id: bgp-underlay
      role: underlay
      nodes:
        - node: spine1
          local_as: 65000
          neighbors:
            - { node: leaf1, remote_as: 65001, type: ebgp, bfd: true }
            - { node: leaf2, remote_as: 65002, type: ebgp, bfd: true }
        - node: spine2
          local_as: 65000
          neighbors:
            - { node: leaf1, remote_as: 65001, type: ebgp, bfd: true }
            - { node: leaf2, remote_as: 65002, type: ebgp, bfd: true }
    - id: bgp-evpn
      role: overlay
      nodes:
        - node: spine1
          local_as: 65000
          role: route_reflector
          neighbors:
            - { node: leaf1, remote_as: 65000, type: ibgp, role: route_reflector_client, address_families: [l2vpn_evpn] }
            - { node: leaf2, remote_as: 65000, type: ibgp, role: route_reflector_client, address_families: [l2vpn_evpn] }
        - node: spine2
          local_as: 65000
          role: route_reflector
          neighbors:
            - { node: leaf1, remote_as: 65000, type: ibgp, role: route_reflector_client, address_families: [l2vpn_evpn] }
            - { node: leaf2, remote_as: 65000, type: ibgp, role: route_reflector_client, address_families: [l2vpn_evpn] }
