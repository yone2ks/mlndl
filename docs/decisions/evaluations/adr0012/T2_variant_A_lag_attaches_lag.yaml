# T2: LAG 上の 802.1Q サブ IF / attaches_to: {lag: <LAG id>}
#
# 別案: LAG は L1 Interface とは別の ID 空間 (layer1.lag) なので、
# attaches_to に新しいキー lag: を追加して明示する。
#
# CLAUDE.md の ADR-0001 では attaches_to の 1 キー形式は
#   {node:} / {interface:} / {link:}
# の 3 択。lag: を増やすのは拡張になる。

ndl_version: "1.0"

meta:
  name: branch-lag-with-subif-attaches-lag
  network_types: [l1-physical, l2-network, l3-unicast]

layer1:
  nodes:
    - {id: br1, role: border, implementation: physical}
    - {id: sw1, role: leaf,   implementation: physical}

  interfaces:
    - {id: br1-eth0, node: br1, name: Gi0/0}
    - {id: br1-eth1, node: br1, name: Gi0/1}
    - {id: sw1-g1,   node: sw1, name: Gi1/0/1}
    - {id: sw1-g2,   node: sw1, name: Gi1/0/2}

  links:
    - {id: link-br1-sw1-a, endpoints: [br1-eth0, sw1-g1], link_speed: 10G, link_role: trunk}
    - {id: link-br1-sw1-b, endpoints: [br1-eth1, sw1-g2], link_speed: 10G, link_role: trunk}

  lag:
    - id: lag-br1-bond0
      type: lacp
      node: br1
      members: [br1-eth0, br1-eth1]
      lacp: {mode: active, min_links: 1}

layer2:
  vlans:
    - id: vlan-10
      vlan_id: 10
      trunk_ports:
        - {node: br1, interface: br1-eth0}
        - {node: br1, interface: br1-eth1}
    - id: vlan-20
      vlan_id: 20
      trunk_ports:
        - {node: br1, interface: br1-eth0}
        - {node: br1, interface: br1-eth1}

  # ---- 別案: LAG の指し方は {lag: <LAG id>} ----
  # attaches_to に lag: を追加 (ADR-0001 の拡張)。
  # 利点: 参照先の種類が構文で分かる (interface と混ざらない)
  # 欠点: 既存の AttachesToObj に 4 つ目のキーが増える / 既決事項の変更
  subinterfaces:
    - id: br1-bond0.10
      attaches_to: {lag: lag-br1-bond0}    # ← ここが差分
      vlan_id: 10
    - id: br1-bond0.20
      attaches_to: {lag: lag-br1-bond0}
      vlan_id: 20

layer3:
  vrfs:
    - {id: vrf-default}

  interfaces:
    - id: br1-bond0-10-l3
      node: br1
      interface: Bond0.10
      ip:   192.168.10.1/24
      ipv6: 2001:db8:10::1/64
      vrf: vrf-default
      attaches_to: {interface: br1-bond0.10}
    - id: br1-bond0-20-l3
      node: br1
      interface: Bond0.20
      ip:   192.168.20.1/24
      ipv6: 2001:db8:20::1/64
      vrf: vrf-default
      attaches_to: {interface: br1-bond0.20}
