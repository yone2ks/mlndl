ndl_version: "1.0"

meta:
  name: vsphere-dvswitch-lab
  network_types: [l1-physical, l2-network]
  # シナリオ: ESXi 1台 + 2 VM + dvSwitch(dvs-01) + ToR(tor-sw1)
  #
  # 書けているもの:
  #   - ESXi を hypervisor として L1 ノードに置き、VM は attaches_to: esxi-01 で載せる
  #   - ESXi の vmnic ↔ ToR の物理ケーブル (L1 links)
  #   - VM の vNIC が VLAN 100 にタグなしで属すること (layer2.vlans の access_ports)
  #
  # 書けていないもの (drafts/0007 で layer2.bridges として設計中):
  #   - dvSwitch / PortGroup そのもの。vNIC がどの仮想スイッチに刺さり、
  #     どの vmnic から外に出るかは書けない
  #   - そのため VM の vNIC と ToR の trunk は、YAML 上でつながっていない
  #
  # drafts/0007 は access_ports を「VLAN タグ付けの宣言」として残す方向なので、
  # 下の access_ports は bridges を導入した後もそのまま有効な記述である。

layer1:
  nodes:
    - id: esxi-01
      name: ESXi-01
      role: hypervisor
      implementation: physical
      device_type: vmware_esxi

    - id: tor-sw1
      name: ToR-SW-1
      role: leaf
      implementation: physical
      device_type: arista_eos

    - id: web-vm1
      name: web-vm1
      role: server
      implementation: vm
      attaches_to: esxi-01           # 文字列糖衣構文 = supporting-node

    - id: web-vm2
      name: web-vm2
      role: server
      implementation: vm
      attaches_to: esxi-01

  interfaces:
    # ESXi 物理 NIC
    - {id: esxi-01-vmnic0, node: esxi-01, name: vmnic0}
    - {id: esxi-01-vmnic1, node: esxi-01, name: vmnic1}

    # ToR 物理ポート
    - {id: tor-sw1-eth1, node: tor-sw1, name: Ethernet1}
    - {id: tor-sw1-eth2, node: tor-sw1, name: Ethernet2}

    # VM vNIC (実際は dvSwitch port group "pg-web" に接続するが、現行は物理 IF として表現)
    - {id: web-vm1-eth0, node: web-vm1, name: eth0}
    - {id: web-vm2-eth0, node: web-vm2, name: eth0}

  links:
    # 物理ケーブル: ESXi vmnic ↔ ToR (trunk)
    - id: link-esxi01-vmnic0-tor1-eth1
      endpoints: [esxi-01-vmnic0, tor-sw1-eth1]
      link_speed: 10G
      link_role: uplink
    - id: link-esxi01-vmnic1-tor1-eth2
      endpoints: [esxi-01-vmnic1, tor-sw1-eth2]
      link_speed: 10G
      link_role: uplink

    # --- ここから先は「現行スキーマでは表現できないものを link で擬似的に書く」例 ---
    # VM の vNIC が dvSwitch port-group "pg-web" に接続している事実を、
    # 苦し紛れに vmnic0 への "link" として書く。これは正しくない。
    # (dvSwitch は L2 ブリッジであり、点対点リンクではない)
    # 本来は layer2.bridges のような構成子が必要。コメントアウトして残す:
    #
    # - id: link-webvm1-pgweb
    #   endpoints: [web-vm1-eth0, esxi-01-vmnic0]   # 嘘
    # - id: link-webvm2-pgweb
    #   endpoints: [web-vm2-eth0, esxi-01-vmnic0]   # 嘘 (1 IF が複数 link 端点になる)

layer2:
  vlans:
    # VLAN 100 = PortGroup "pg-web" 相当。dvSwitch 側の PortGroup → VLAN の対応は書けない
    - id: vlan-100
      vlan_id: 100
      trunk_ports:
        - {interface: tor-sw1-eth1}   # IF の ID を参照する (name の Ethernet1 ではない)
        - {interface: tor-sw1-eth2}
      access_ports:
        # VM の vNIC は VLAN 100 にタグなしで属する。
        # 実体は「vNIC → pg-web (dvSwitch) → vmnic → ToR」の経路だが、dvSwitch のホップは書けない
        - {interface: web-vm1-eth0}
        - {interface: web-vm2-eth0}
