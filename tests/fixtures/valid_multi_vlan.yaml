ndl_version: "1.0"

meta:
  name: multi-vlan-spine-leaf
  description: 2 Spine / 3 Leaf / 3 Server — 5 VLAN (tenant-a-web/app, tenant-b-web, storage, management)
  network_types: [l1-physical, l2-network, l3-unicast]

layer1:
  nodes:
    - id: spine1
      name: Spine-1
      implementation: vm
      role: spine
      device_type: cumulus_linux

    - id: spine2
      name: Spine-2
      implementation: vm
      role: spine
      device_type: cumulus_linux

    - id: leaf1
      name: Leaf-1
      implementation: vm
      role: leaf
      device_type: cumulus_linux

    - id: leaf2
      name: Leaf-2
      implementation: vm
      role: leaf
      device_type: cumulus_linux

    - id: leaf3
      name: Leaf-3
      implementation: vm
      role: leaf
      device_type: cumulus_linux

    - id: server1
      name: Server-1
      implementation: physical
      role: server

    - id: server2
      name: Server-2
      implementation: physical
      role: server

    - id: server3
      name: Server-3
      implementation: physical
      role: server

  interfaces:
    # Spine1
    - { id: spine1-swp1, node: spine1, name: swp1 }
    - { id: spine1-swp2, node: spine1, name: swp2 }
    - { id: spine1-swp3, node: spine1, name: swp3 }

    # Spine2
    - { id: spine2-swp1, node: spine2, name: swp1 }
    - { id: spine2-swp2, node: spine2, name: swp2 }
    - { id: spine2-swp3, node: spine2, name: swp3 }

    # Leaf1
    - { id: leaf1-swp51, node: leaf1, name: swp51 }
    - { id: leaf1-swp52, node: leaf1, name: swp52 }
    - { id: leaf1-swp1,  node: leaf1, name: swp1  }
    - { id: leaf1-swp2,  node: leaf1, name: swp2  }

    # Leaf2
    - { id: leaf2-swp51, node: leaf2, name: swp51 }
    - { id: leaf2-swp52, node: leaf2, name: swp52 }
    - { id: leaf2-swp1,  node: leaf2, name: swp1  }
    - { id: leaf2-swp2,  node: leaf2, name: swp2  }

    # Leaf3
    - { id: leaf3-swp51, node: leaf3, name: swp51 }
    - { id: leaf3-swp52, node: leaf3, name: swp52 }
    - { id: leaf3-swp1,  node: leaf3, name: swp1  }

    # Servers
    - { id: server1-eth0, node: server1, name: eth0 }
    - { id: server2-eth0, node: server2, name: eth0 }
    - { id: server3-eth0, node: server3, name: eth0 }

  links:
    # Spine1 ↔ Leaf
    - { id: link-spine1-leaf1, endpoints: [spine1-swp1, leaf1-swp51], link_speed: 10G, link_role: underlay }
    - { id: link-spine1-leaf2, endpoints: [spine1-swp2, leaf2-swp51], link_speed: 10G, link_role: underlay }
    - { id: link-spine1-leaf3, endpoints: [spine1-swp3, leaf3-swp51], link_speed: 10G, link_role: underlay }

    # Spine2 ↔ Leaf
    - { id: link-spine2-leaf1, endpoints: [spine2-swp1, leaf1-swp52], link_speed: 10G, link_role: underlay }
    - { id: link-spine2-leaf2, endpoints: [spine2-swp2, leaf2-swp52], link_speed: 10G, link_role: underlay }
    - { id: link-spine2-leaf3, endpoints: [spine2-swp3, leaf3-swp52], link_speed: 10G, link_role: underlay }

    # Leaf → Server (access)
    - { id: link-leaf1-server1, endpoints: [leaf1-swp1, server1-eth0], link_speed: 1G, link_role: access }
    - { id: link-leaf2-server2, endpoints: [leaf2-swp1, server2-eth0], link_speed: 1G, link_role: access }
    - { id: link-leaf3-server3, endpoints: [leaf3-swp1, server3-eth0], link_speed: 1G, link_role: access }

    # Leaf1 ↔ Leaf2 peer-link (trunk — VLAN 100/200/300/400/900)
    - { id: link-leaf1-leaf2-trunk, endpoints: [leaf1-swp2, leaf2-swp2], link_speed: 10G, link_role: peer-link }

layer2:
  vlans:
    - id: vlan-100
      vlan_id: 100
      name: tenant-a-web
      trunk_ports:
        - { interface: leaf1-swp1 }
        - { interface: leaf2-swp1 }
        - { interface: leaf1-swp2 }
        - { interface: leaf2-swp2 }
      access_ports:
        - { interface: server1-eth0 }

    - id: vlan-200
      vlan_id: 200
      name: tenant-a-app
      trunk_ports:
        - { interface: leaf1-swp1 }
        - { interface: leaf2-swp1 }
        - { interface: leaf1-swp2 }
        - { interface: leaf2-swp2 }

    - id: vlan-300
      vlan_id: 300
      name: tenant-b-web
      trunk_ports:
        - { interface: leaf2-swp1 }
        - { interface: leaf3-swp1 }
      access_ports:
        - { interface: server2-eth0 }

    - id: vlan-400
      vlan_id: 400
      name: storage
      trunk_ports:
        - { interface: leaf3-swp1 }
      access_ports:
        - { interface: server3-eth0 }

    - id: vlan-900
      vlan_id: 900
      name: management
      trunk_ports:
        - { interface: leaf1-swp1 }
        - { interface: leaf2-swp1 }
        - { interface: leaf3-swp1 }
        - { interface: leaf1-swp2 }
        - { interface: leaf2-swp2 }

  vteps:
    # ノードごとの VTEP (ADR-0014)。sources が 1 つなのでアドレスは lo の ip
    - {id: vtep-leaf1, sources: [leaf1-lo]}
    - {id: vtep-leaf2, sources: [leaf2-lo]}
    - {id: vtep-leaf3, sources: [leaf3-lo]}

  vxlan:
    - id: vni-10100
      type: l2vni
      vni: 10100
      vlan: vlan-100
      vteps: [vtep-leaf1, vtep-leaf2]

    - id: vni-10200
      type: l2vni
      vni: 10200
      vlan: vlan-200
      vteps: [vtep-leaf1, vtep-leaf2]

    - id: vni-10300
      type: l2vni
      vni: 10300
      vlan: vlan-300
      vteps: [vtep-leaf2, vtep-leaf3]

    - id: vni-10900
      type: l3vni
      vni: 10900
      vrf: vrf-tenant-a
      irb_mode: symmetric

layer3:
  vrfs:
    - id: vrf-default

    - id: vrf-tenant-a
      rd: "65001:100"
      l3vni: vni-10900
      route_targets:
        import: ["65001:100"]
        export: ["65001:100"]

  interfaces:
    - { id: spine1-lo, node: spine1, name: lo, ip: 10.0.0.1/32 }
    - { id: spine2-lo, node: spine2, name: lo, ip: 10.0.0.2/32 }
    - { id: leaf1-lo,  node: leaf1,  name: lo, ip: 10.0.0.11/32 }
    - { id: leaf2-lo,  node: leaf2,  name: lo, ip: 10.0.0.12/32 }
    - { id: leaf3-lo,  node: leaf3,  name: lo, ip: 10.0.0.13/32 }

    # unnumbered の L3 IF (ip も ipv6 も書かない。ADR-0010 D4)
    - { id: spine1-swp1-l3, node: spine1, name: swp1, vrf: vrf-default, attaches_to: {interface: spine1-swp1} }
    - { id: spine1-swp2-l3, node: spine1, name: swp2, vrf: vrf-default, attaches_to: {interface: spine1-swp2} }
    - { id: spine1-swp3-l3, node: spine1, name: swp3, vrf: vrf-default, attaches_to: {interface: spine1-swp3} }
    - { id: spine2-swp1-l3, node: spine2, name: swp1, vrf: vrf-default, attaches_to: {interface: spine2-swp1} }
    - { id: spine2-swp2-l3, node: spine2, name: swp2, vrf: vrf-default, attaches_to: {interface: spine2-swp2} }
    - { id: spine2-swp3-l3, node: spine2, name: swp3, vrf: vrf-default, attaches_to: {interface: spine2-swp3} }
    - { id: leaf1-swp51-l3, node: leaf1, name: swp51, vrf: vrf-default, attaches_to: {interface: leaf1-swp51} }
    - { id: leaf1-swp52-l3, node: leaf1, name: swp52, vrf: vrf-default, attaches_to: {interface: leaf1-swp52} }
    - { id: leaf2-swp51-l3, node: leaf2, name: swp51, vrf: vrf-default, attaches_to: {interface: leaf2-swp51} }
    - { id: leaf2-swp52-l3, node: leaf2, name: swp52, vrf: vrf-default, attaches_to: {interface: leaf2-swp52} }
    - { id: leaf3-swp51-l3, node: leaf3, name: swp51, vrf: vrf-default, attaches_to: {interface: leaf3-swp51} }
    - { id: leaf3-swp52-l3, node: leaf3, name: swp52, vrf: vrf-default, attaches_to: {interface: leaf3-swp52} }

    - id: leaf1-vlan100
      node: leaf1
      name: vlan-100
      attaches_to: {vlan: vlan-100}
      ip: 192.168.100.1/24
      vrf: vrf-tenant-a

    - id: leaf2-vlan100
      node: leaf2
      name: vlan-100
      attaches_to: {vlan: vlan-100}
      ip: 192.168.100.2/24
      vrf: vrf-tenant-a

    - id: leaf1-vlan200
      node: leaf1
      name: vlan-200
      attaches_to: {vlan: vlan-200}
      ip: 192.168.200.1/24
      vrf: vrf-tenant-a

    - id: leaf2-vlan200
      node: leaf2
      name: vlan-200
      attaches_to: {vlan: vlan-200}
      ip: 192.168.200.2/24
      vrf: vrf-tenant-a

    - id: leaf2-vlan300
      node: leaf2
      name: vlan-300
      attaches_to: {vlan: vlan-300}
      ip: 172.16.30.1/24
      vrf: vrf-default

    - id: leaf3-vlan400
      node: leaf3
      name: vlan-400
      attaches_to: {vlan: vlan-400}
      ip: 172.16.40.1/24
      vrf: vrf-default

control_plane:
  # 全 eBGP の unnumbered。1 本のセッションで ipv4_unicast と l2vpn_evpn を運ぶ (ADR-0010 の EVPN の書き方の 1 つ目)。
  # leaf はそれぞれの AS (旧版は EVPN で leaf も AS65000 にしていた。ADR-0010 F4)
  bgp:
    - id: bgp-default
      nodes:
        - {node: spine1, local_as: 65000}
        - {node: spine2, local_as: 65000}
        - {node: leaf1,  local_as: 65001}
        - {node: leaf2,  local_as: 65002}
        - {node: leaf3,  local_as: 65003}

  routing_neighbors:
    - {id: bgp-peer-spine1-leaf1, type: bgp, from: {node: spine1, update_source: spine1-swp1-l3}, to: {node: leaf1, update_source: leaf1-swp51-l3}, address_families: [ipv4_unicast, l2vpn_evpn]}
    - {id: bgp-peer-spine1-leaf2, type: bgp, from: {node: spine1, update_source: spine1-swp2-l3}, to: {node: leaf2, update_source: leaf2-swp51-l3}, address_families: [ipv4_unicast, l2vpn_evpn]}
    - {id: bgp-peer-spine1-leaf3, type: bgp, from: {node: spine1, update_source: spine1-swp3-l3}, to: {node: leaf3, update_source: leaf3-swp51-l3}, address_families: [ipv4_unicast, l2vpn_evpn]}
    - {id: bgp-peer-spine2-leaf1, type: bgp, from: {node: spine2, update_source: spine2-swp1-l3}, to: {node: leaf1, update_source: leaf1-swp52-l3}, address_families: [ipv4_unicast, l2vpn_evpn]}
    - {id: bgp-peer-spine2-leaf2, type: bgp, from: {node: spine2, update_source: spine2-swp2-l3}, to: {node: leaf2, update_source: leaf2-swp52-l3}, address_families: [ipv4_unicast, l2vpn_evpn]}
    - {id: bgp-peer-spine2-leaf3, type: bgp, from: {node: spine2, update_source: spine2-swp3-l3}, to: {node: leaf3, update_source: leaf3-swp52-l3}, address_families: [ipv4_unicast, l2vpn_evpn]}
