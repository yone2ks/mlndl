ndl_version: "1.0"

meta:
  name: spine-leaf-mlag-evpn
  description: 2 Spine / 2 Leaf (MLAG ペア) / Server1 — EVPN/VXLAN 構成
  network_types: [l1-physical, l2-network, l3-unicast]

layer1:
  nodes:
    - id: spine1
      name: Spine-1
      implementation: vm
      role: spine
      device_type: cumulus_linux

    - id: spine2
      name: Spine-2
      implementation: vm
      role: spine
      device_type: cumulus_linux

    - id: leaf1
      name: Leaf-1
      implementation: vm
      role: leaf
      device_type: cumulus_linux

    - id: leaf2
      name: Leaf-2
      implementation: vm
      role: leaf
      device_type: cumulus_linux

    - id: server1
      name: Server-1
      implementation: physical
      role: server

    - id: leaf3
      name: Leaf-3
      implementation: vm
      role: leaf
      device_type: cumulus_linux

    - id: server2
      name: Server-2
      implementation: physical
      role: server

  interfaces:
    # ── Spine1 ──────────────────────────────────────────────────────────
    - { id: spine1-swp1, node: spine1, name: swp1 }   # → Leaf1
    - { id: spine1-swp2, node: spine1, name: swp2 }   # → Leaf2
    - { id: spine1-swp3, node: spine1, name: swp3 }   # → Leaf3

    # ── Spine2 ──────────────────────────────────────────────────────────
    - { id: spine2-swp1, node: spine2, name: swp1 }   # → Leaf1
    - { id: spine2-swp2, node: spine2, name: swp2 }   # → Leaf2
    - { id: spine2-swp3, node: spine2, name: swp3 }   # → Leaf3

    # ── Leaf1 ───────────────────────────────────────────────────────────
    - { id: leaf1-swp51, node: leaf1, name: swp51 }   # → Spine1 (underlay)
    - { id: leaf1-swp52, node: leaf1, name: swp52 }   # → Spine2 (underlay)
    - { id: leaf1-swp49, node: leaf1, name: swp49 }   # peer-link member
    - { id: leaf1-swp50, node: leaf1, name: swp50 }   # peer-link member
    - { id: leaf1-swp1,  node: leaf1, name: swp1  }   # MLAG → Server1

    # ── Leaf2 ───────────────────────────────────────────────────────────
    - { id: leaf2-swp51, node: leaf2, name: swp51 }   # → Spine1 (underlay)
    - { id: leaf2-swp52, node: leaf2, name: swp52 }   # → Spine2 (underlay)
    - { id: leaf2-swp49, node: leaf2, name: swp49 }   # peer-link member
    - { id: leaf2-swp50, node: leaf2, name: swp50 }   # peer-link member
    - { id: leaf2-swp1,  node: leaf2, name: swp1  }   # MLAG → Server1

    # ── Server1 ─────────────────────────────────────────────────────────
    - { id: server1-eth0, node: server1, name: eth0 }
    - { id: server1-eth1, node: server1, name: eth1 }

    # ── Leaf3 ───────────────────────────────────────────────────────────
    - { id: leaf3-swp51, node: leaf3, name: swp51 }   # → Spine1 (underlay)
    - { id: leaf3-swp52, node: leaf3, name: swp52 }   # → Spine2 (underlay)
    - { id: leaf3-swp1,  node: leaf3, name: swp1  }   # LACP → Server2
    - { id: leaf3-swp2,  node: leaf3, name: swp2  }   # LACP → Server2

    # ── Server2 ─────────────────────────────────────────────────────────
    - { id: server2-eth0, node: server2, name: eth0 }
    - { id: server2-eth1, node: server2, name: eth1 }

  links:
    # ── Spine1 ↔ Leaf（underlay 10G）───────────────────────────────────
    - id: link-spine1-leaf1
      endpoints: [spine1-swp1, leaf1-swp51]
      link_speed: 10G
      mtu: 9216
      link_role: underlay

    - id: link-spine1-leaf2
      endpoints: [spine1-swp2, leaf2-swp51]
      link_speed: 10G
      mtu: 9216
      link_role: underlay

    # ── Spine2 ↔ Leaf（underlay 10G）───────────────────────────────────
    - id: link-spine2-leaf1
      endpoints: [spine2-swp1, leaf1-swp52]
      link_speed: 10G
      mtu: 9216
      link_role: underlay

    - id: link-spine2-leaf2
      endpoints: [spine2-swp2, leaf2-swp52]
      link_speed: 10G
      mtu: 9216
      link_role: underlay

    # ── MLAG peer-link（Leaf1 ↔ Leaf2、2-member LACP）──────────────────
    - id: link-mlag-peerlink-1
      endpoints: [leaf1-swp49, leaf2-swp49]
      link_speed: 10G
      mtu: 9216
      link_role: peer-link

    - id: link-mlag-peerlink-2
      endpoints: [leaf1-swp50, leaf2-swp50]
      link_speed: 10G
      mtu: 9216
      link_role: peer-link

    # ── Spine1/Spine2 ↔ Leaf3（underlay 10G）──────────────────────────
    - id: link-spine1-leaf3
      endpoints: [spine1-swp3, leaf3-swp51]
      link_speed: 10G
      mtu: 9216
      link_role: underlay

    - id: link-spine2-leaf3
      endpoints: [spine2-swp3, leaf3-swp52]
      link_speed: 10G
      mtu: 9216
      link_role: underlay

    # ── Leaf3 → Server2（LACP LAG 2本）────────────────────────────────
    - id: link-leaf3-server2-1
      endpoints: [leaf3-swp1, server2-eth0]
      link_speed: 10G
      link_role: access

    - id: link-leaf3-server2-2
      endpoints: [leaf3-swp2, server2-eth1]
      link_speed: 10G
      link_role: access

    # ── MLAG → Server1（leaf1/leaf2 から V字収束）──────────────────────
    - id: link-leaf1-server1
      endpoints: [leaf1-swp1, server1-eth0]
      link_speed: 1G
      link_role: access

    - id: link-leaf2-server1
      endpoints: [leaf2-swp1, server1-eth1]
      link_speed: 1G
      link_role: access

  lag:
    # peer-link（leaf1 側 LACP bond）
    - id: lag-peer-link
      type: lacp
      node: leaf1
      members: [leaf1-swp49, leaf1-swp50]
      lacp: {mode: active, min_links: 1}

    # Server1 向け MLAG（leaf1 + leaf2）
    - id: lag-mlag-server1
      type: mlag
      nodes: [leaf1, leaf2]
      members: [leaf1-swp1, leaf2-swp1]
      lacp: {mode: active, min_links: 1}
      peer_link: lag-peer-link
      peer_link_interface: peerlink.4094
      domain_id: 10
      system_mac: "44:38:39:ff:00:0a"   # 両 leaf 共通 MLAG system MAC
      client_lag: lag-server1-bond0      # 対向 server1 bond への単方向参照

    # Server1 側 LACP bond（MLAG 対向）
    - id: lag-server1-bond0
      type: lacp
      node: server1
      members: [server1-eth0, server1-eth1]
      lacp: {mode: active, min_links: 1}

    # Leaf3 → Server2 LACP bond（単一ノード、2本）
    - id: lag-leaf3-server2
      type: lacp
      node: leaf3
      members: [leaf3-swp1, leaf3-swp2]
      lacp: {mode: active, min_links: 1}

    # Server2 側 LACP bond
    - id: lag-server2-bond0
      type: lacp
      node: server2
      members: [server2-eth0, server2-eth1]
      lacp: {mode: active, min_links: 1}

layer2:
  vlans:
    - id: vlan-100
      vlan_id: 100
      name: tenant-a
      trunk_ports:
        - {lag: lag-mlag-server1}   # MLAG は 1 エントリで leaf1 / leaf2 の両方 (ADR-0013 D2)

  vteps:
    # MLAG ペア leaf1 / leaf2 が共有する VTEP (ADR-0014)。各 lo は固有 IP、共有するアドレスは address
    - id: vtep-leaf1-leaf2
      sources: [leaf1-lo, leaf2-lo]
      address: 10.0.100.12/32

  vxlan:
    - id: vni-10100
      type: l2vni
      vni: 10100
      vlan: vlan-100
      vteps: [vtep-leaf1-leaf2]

    - id: vni-10900
      type: l3vni
      vni: 10900
      vrf: vrf-tenant-a
      irb_mode: symmetric

layer3:
  vrfs:
    - id: vrf-default

    - id: vrf-tenant-a
      rd: "65001:100"
      l3vni: vni-10900
      route_targets:
        import: ["65001:100"]
        export: ["65001:100"]

  interfaces:
    # Loopbacks
    - { id: spine1-lo, node: spine1, name: lo, ip: 10.0.0.1/32 }
    - { id: spine2-lo, node: spine2, name: lo, ip: 10.0.0.2/32 }
    - { id: leaf1-lo,  node: leaf1,  name: lo, ip: 10.0.0.11/32 }
    - { id: leaf2-lo,  node: leaf2,  name: lo, ip: 10.0.0.12/32 }

    # Spine ↔ Leaf P2P (spine 側)
    - { id: spine1-swp1-l3, node: spine1, name: swp1, ip: 10.1.0.0/31, vrf: vrf-default, attaches_to: {interface: spine1-swp1} }
    - { id: spine1-swp2-l3, node: spine1, name: swp2, ip: 10.1.0.2/31, vrf: vrf-default, attaches_to: {interface: spine1-swp2} }
    - { id: spine2-swp1-l3, node: spine2, name: swp1, ip: 10.1.0.4/31, vrf: vrf-default, attaches_to: {interface: spine2-swp1} }
    - { id: spine2-swp2-l3, node: spine2, name: swp2, ip: 10.1.0.6/31, vrf: vrf-default, attaches_to: {interface: spine2-swp2} }

    # Spine1 ↔ Leaf P2P
    - id: leaf1-swp51-l3
      node: leaf1
      name: swp51
      ip: 10.1.0.1/31
      vrf: vrf-default
      attaches_to: {interface: leaf1-swp51}

    - id: leaf2-swp51-l3
      node: leaf2
      name: swp51
      ip: 10.1.0.3/31
      vrf: vrf-default
      attaches_to: {interface: leaf2-swp51}

    # Spine2 ↔ Leaf P2P
    - id: leaf1-swp52-l3
      node: leaf1
      name: swp52
      ip: 10.1.0.5/31
      vrf: vrf-default
      attaches_to: {interface: leaf1-swp52}

    - id: leaf2-swp52-l3
      node: leaf2
      name: swp52
      ip: 10.1.0.7/31
      vrf: vrf-default
      attaches_to: {interface: leaf2-swp52}

    # SVI
    - id: leaf1-vlan100
      node: leaf1
      name: vlan-100
      attaches_to: {vlan: vlan-100}
      ip: 192.168.100.1/24
      vrf: vrf-tenant-a

control_plane:
  # 全 eBGP: spine は AS65000、leaf はそれぞれの AS。underlay は直結の /31 どうし、
  # EVPN の overlay はループバックどうしの eBGP multihop と、2 本に分ける (ADR-0010 の EVPN の書き方の 2 つ目)
  bgp:
    - id: bgp-default                  # vrf 省略 = default VRF
      nodes:
        - {node: spine1, local_as: 65000}
        - {node: spine2, local_as: 65000}
        - {node: leaf1,  local_as: 65001}
        - {node: leaf2,  local_as: 65002}

  bfd:
    - id: bfd-global
      min_tx: 300
      min_rx: 300
      multiplier: 3
      nodes: [spine1, spine2, leaf1, leaf2]

  routing_neighbors:
    # underlay: 直結の /31 どうし (通り道は update_source の L3 IF から導く)
    - {id: bgp-peer-spine1-leaf1, type: bgp, from: {node: spine1, update_source: spine1-swp1-l3}, to: {node: leaf1, update_source: leaf1-swp51-l3}, address_families: [ipv4_unicast], bfd: true}
    - {id: bgp-peer-spine1-leaf2, type: bgp, from: {node: spine1, update_source: spine1-swp2-l3}, to: {node: leaf2, update_source: leaf2-swp51-l3}, address_families: [ipv4_unicast], bfd: true}
    - {id: bgp-peer-spine2-leaf1, type: bgp, from: {node: spine2, update_source: spine2-swp1-l3}, to: {node: leaf1, update_source: leaf1-swp52-l3}, address_families: [ipv4_unicast], bfd: true}
    - {id: bgp-peer-spine2-leaf2, type: bgp, from: {node: spine2, update_source: spine2-swp2-l3}, to: {node: leaf2, update_source: leaf2-swp52-l3}, address_families: [ipv4_unicast], bfd: true}
    # overlay: ループバックどうし (multihop)
    - {id: bgp-peer-spine1-leaf1-overlay, type: bgp, from: {node: spine1, update_source: spine1-lo}, to: {node: leaf1, update_source: leaf1-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine1-leaf2-overlay, type: bgp, from: {node: spine1, update_source: spine1-lo}, to: {node: leaf2, update_source: leaf2-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine2-leaf1-overlay, type: bgp, from: {node: spine2, update_source: spine2-lo}, to: {node: leaf1, update_source: leaf1-lo}, address_families: [l2vpn_evpn]}
    - {id: bgp-peer-spine2-leaf2-overlay, type: bgp, from: {node: spine2, update_source: spine2-lo}, to: {node: leaf2, update_source: leaf2-lo}, address_families: [l2vpn_evpn]}
