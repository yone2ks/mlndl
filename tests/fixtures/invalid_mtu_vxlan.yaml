ndl_version: "1.0"
meta:
  name: invalid-mtu-vxlan

layer1:
  nodes:
    - id: leaf1
    - id: leaf2
  interfaces:
    - id: leaf1-swp1
      node: leaf1
      name: swp1
    - id: leaf2-swp1
      node: leaf2
      name: swp1
  links:
    - id: link-underlay
      endpoints: [leaf1-swp1, leaf2-swp1]
      mtu: 1500             # ← VxLAN 使用時は 1550 以上必須
      link_role: underlay

layer3:
  vrfs:
    - id: vrf-a
  interfaces:
    - id: leaf1-lo
      node: leaf1
      name: lo
    - id: leaf2-lo
      node: leaf2
      name: lo

layer2:
  vlans:
    - id: vlan-100
      vlan_id: 100
  vteps:
    - id: vtep-leaf1-leaf2
      sources: [leaf1-lo, leaf2-lo]
      address: 10.0.100.12/32
  vxlan:
    - id: vni-100
      type: l2vni
      vni: 10100
      vlan: vlan-100
      vteps: [vtep-leaf1-leaf2]
