ndl_version: "1.0"

meta:
  name: mlag-spine-leaf-lab

layer1:
  nodes:
    - id: leaf1
      name: Leaf-1
      implementation: vm
      role: leaf
      device_type: cumulus_linux

    - id: leaf2
      name: Leaf-2
      implementation: vm
      role: leaf
      device_type: cumulus_linux

    - id: server1
      name: Server-1
      implementation: physical
      role: server

  interfaces:
    - id: leaf1-swp1
      node: leaf1
      name: swp1
    - id: leaf1-swp2
      node: leaf1
      name: swp2
    - id: leaf1-swp49
      node: leaf1
      name: swp49
    - id: leaf1-swp50
      node: leaf1
      name: swp50
    - id: leaf2-swp1
      node: leaf2
      name: swp1
    - id: leaf2-swp2
      node: leaf2
      name: swp2
    - id: leaf2-swp49
      node: leaf2
      name: swp49
    - id: leaf2-swp50
      node: leaf2
      name: swp50
    - id: server1-eth0
      node: server1
      name: eth0
    - id: server1-eth1
      node: server1
      name: eth1

  links: []

  lag:
    # ピアリンクと Server1 向けの bond は、どちらも機器ごとの LAG (ADR-0023 D1・D6)
    - id: lag-leaf1-peer
      node: leaf1
      name: peerlink
      members: [leaf1-swp49, leaf1-swp50]
      lacp: {mode: active, min_links: 1}

    - id: lag-leaf2-peer
      node: leaf2
      name: peerlink
      members: [leaf2-swp49, leaf2-swp50]
      lacp: {mode: active, min_links: 1}

    - id: lag-leaf1-server1
      node: leaf1
      name: bond1
      members: [leaf1-swp1]
      lacp: {mode: active, min_links: 1}

    - id: lag-leaf2-server1
      node: leaf2
      name: bond1
      members: [leaf2-swp1]
      lacp: {mode: active, min_links: 1}

  ethernet_segments:
    # leaf1 / leaf2 の bond1 を Server1 から 1 本に見せる。方式名・clag-id は書かない (ADR-0023 D2)
    - id: es-server1
      members: [{lag: lag-leaf1-server1}, {lag: lag-leaf2-server1}]
