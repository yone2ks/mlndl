# ADR-0018: 事業者網やトンネルを越えるセッション
#
# - 東京と大阪は広域イーサ (net-wideether) でつながる。箱の中の L2 の転送を layer2.bridges に書き、
#   拠点のルーターどうしの BGP / OSPF を両端 node で書く。通り道は {bridge: bridge-wideether}
# - 東京と福岡はインターネット (net-internet) の上の GRE でつながる。BGP の update_source にトンネル IF を書く。
#   通り道は {tunnel: [tunnel-tokyo-fukuoka, tunnel-fukuoka-tokyo]}
# - インターネットの箱には bridge を書かない (L2 で透過しない)
ndl_version: "1.0"

meta:
  name: wan-bridge-tunnel
  network_types: [l1-physical, l2-network, l3-unicast]

layer1:
  nodes:
    - {id: tokyo-rtr, role: border, implementation: physical, labels: {site: tokyo}}
    - {id: osaka-rtr, role: border, implementation: physical, labels: {site: osaka}}
    - {id: fukuoka-rtr, role: border, implementation: physical, labels: {site: fukuoka}}
    - {id: net-wideether, name: Wide-area Ethernet, role: provider-network}
    - {id: net-internet, name: Internet, role: provider-network}

  interfaces:
    - {id: tokyo-rtr-ge0, node: tokyo-rtr, name: ge-0/0/0}
    - {id: tokyo-rtr-ge1, node: tokyo-rtr, name: ge-0/0/1}
    - {id: osaka-rtr-ge0, node: osaka-rtr, name: ge-0/0/0}
    - {id: fukuoka-rtr-ge1, node: fukuoka-rtr, name: ge-0/0/1}
    - {id: net-wideether-tokyo, node: net-wideether, name: tokyo}
    - {id: net-wideether-osaka, node: net-wideether, name: osaka}
    - {id: net-internet-tokyo, node: net-internet, name: tokyo}
    - {id: net-internet-fukuoka, node: net-internet, name: fukuoka}

  links:
    - {id: link-tokyo-wideether, endpoints: [tokyo-rtr-ge0, net-wideether-tokyo], link_speed: 1G}
    - {id: link-osaka-wideether, endpoints: [osaka-rtr-ge0, net-wideether-osaka], link_speed: 1G}
    - {id: link-tokyo-internet, endpoints: [tokyo-rtr-ge1, net-internet-tokyo], link_speed: 1G}
    - {id: link-fukuoka-internet, endpoints: [fukuoka-rtr-ge1, net-internet-fukuoka], link_speed: 1G}

layer2:
  bridges:
    - id: bridge-wideether
      name: WE-220
      ports:                                  # 箱のポートだけを書く。拠点のルーターのポートは書かない
        - {interface: net-wideether-tokyo}
        - {interface: net-wideether-osaka}
      description: Port-based wide-area Ethernet between Tokyo and Osaka

layer3:
  interfaces:
    - {id: tokyo-rtr-ge0-l3, node: tokyo-rtr, name: ge-0/0/0, ip: 10.100.0.1/30, attaches_to: {interface: tokyo-rtr-ge0}}
    - {id: osaka-rtr-ge0-l3, node: osaka-rtr, name: ge-0/0/0, ip: 10.100.0.2/30, attaches_to: {interface: osaka-rtr-ge0}}
    - {id: tokyo-rtr-inet, node: tokyo-rtr, name: ge-0/0/1, ip: 198.51.100.2/30, attaches_to: {interface: tokyo-rtr-ge1}}
    - {id: fukuoka-rtr-inet, node: fukuoka-rtr, name: ge-0/0/1, ip: 203.0.113.2/30, attaches_to: {interface: fukuoka-rtr-ge1}}

  tunnel_interfaces:
    - {id: tunnel-tokyo-fukuoka, node: tokyo-rtr, type: gre, source: tokyo-rtr-inet, destination_interface: fukuoka-rtr-inet, ip: 172.31.0.1/30}
    - {id: tunnel-fukuoka-tokyo, node: fukuoka-rtr, type: gre, source: fukuoka-rtr-inet, destination_interface: tokyo-rtr-inet, ip: 172.31.0.2/30}

control_plane:
  bgp:
    - id: bgp-default
      nodes:
        - {node: tokyo-rtr, local_as: 65001}
        - {node: osaka-rtr, local_as: 65002}
        - {node: fukuoka-rtr, local_as: 65003}
  ospf:
    - {id: ospf-wan, nodes: [{node: tokyo-rtr}, {node: osaka-rtr}]}

  routing_neighbors:
    - id: bgp-peer-tokyo-osaka
      type: bgp
      from: {node: tokyo-rtr, update_source: tokyo-rtr-ge0-l3}
      to:   {node: osaka-rtr, update_source: osaka-rtr-ge0-l3}
      address_families: [ipv4_unicast]
    - id: bgp-peer-tokyo-fukuoka-gre
      type: bgp
      from: {node: tokyo-rtr,   update_source: tunnel-tokyo-fukuoka}
      to:   {node: fukuoka-rtr, update_source: tunnel-fukuoka-tokyo}
      address_families: [ipv4_unicast]
    - id: ospf-adj-tokyo-osaka
      type: ospf
      from: {node: tokyo-rtr, interface: tokyo-rtr-ge0-l3}
      to:   {node: osaka-rtr, interface: osaka-rtr-ge0-l3}
      area: 0.0.0.0
